name: Seven Web Runtime Regression

on:
  pull_request:
    paths:
      - 'compiler/**'
      - 'std/frontend/**'
      - 'examples/web_app.sev'
      - 'website/**'
      - '.github/workflows/web-runtime-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - name: Reconstruct audited Seven compiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/native-seeds
          cat seed/native/final/v1/part*.b64 | tr -d '\r\n\t ' | base64 --decode > build/native-seeds.zip
          echo '670646ab39df2f2a111c664e16023af3ddc3b203982945609193da99d8c4bac7  build/native-seeds.zip' | sha256sum --check
          unzip -q build/native-seeds.zip -d build/native-seeds
          echo '156bb5f78286431db7813d932bdf2835029ee706e1de61829ca42be81abf5802  build/native-seeds/seven-linux' | sha256sum --check
          chmod +x build/native-seeds/seven-linux

      - name: Build official interactive example
        shell: bash
        run: |
          set -euo pipefail
          build/native-seeds/seven-linux web build examples/web_app.sev build/probe
          test -s build/probe/app.wasm

      - name: Prove frontend imports execute
        shell: bash
        run: |
          set -euo pipefail
          node - build/probe/app.wasm <<'JS'
          const fs = require('fs');
          const bytes = fs.readFileSync(process.argv[2]);
          const calls = [];
          let memory;
          const noop = name => (...args) => { calls.push([name, ...args]); return 0; };
          const imports = { seven: {
            terminal_diga: noop('terminal_diga'),
            frontend_monta: noop('frontend_monta'),
            frontend_texto: noop('frontend_texto'),
            frontend_atributo: noop('frontend_atributo'),
            frontend_classe_adiciona: noop('frontend_classe_adiciona'),
            frontend_classe_remove: noop('frontend_classe_remove'),
            frontend_escuta: noop('frontend_escuta'),
            frontend_navega: noop('frontend_navega'),
            frontend_injeta_css: noop('frontend_injeta_css'),
            frontend_fetch_texto: noop('frontend_fetch_texto'),
            frontend_resposta_texto: noop('frontend_resposta_texto'),
            frontend_resposta_status: noop('frontend_resposta_status'),
            frontend_evento_valor: noop('frontend_evento_valor'),
            frontend_armazena: noop('frontend_armazena'),
            frontend_carrega: noop('frontend_carrega'),
            frontend_remove: noop('frontend_remove')
          }};
          (async () => {
            const { instance } = await WebAssembly.instantiate(bytes, imports);
            memory = instance.exports.memory;
            const code = instance.exports.seven_start();
            console.log('seven_start:', code);
            console.log('calls:', JSON.stringify(calls));
            if (code !== 0) throw new Error('unexpected start code');
            if (!calls.some(call => call[0] === 'frontend_monta')) {
              throw new Error('transition compiler generated a web app that never calls frontend_monta');
            }
            if (!calls.some(call => call[0] === 'frontend_injeta_css')) {
              throw new Error('transition compiler generated a web app that never calls frontend_injeta_css');
            }
          })().catch(error => { console.error(error); process.exit(1); });
          JS
