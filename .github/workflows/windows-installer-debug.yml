name: Seven Windows Installer Diagnostic

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Verify installer seed archive
        shell: bash
        run: |
          set -euo pipefail
          test -f seed/native/native-seeds.zip
          mkdir -p build/native-seeds
          cp seed/native/native-seeds.zip build/native-seeds.zip
          echo 'fa83be6c949b4e303a74dfe441883316e285baa1388f5b4370312f3c3c506464  build/native-seeds.zip' | sha256sum --check
          unzip -q build/native-seeds.zip -d build/native-seeds
          echo '6c65dee95cbb3fe2b99a05bbe65a18dd11b3621b59f5f6bb431a5584a062ef86  build/native-seeds/seven-windows.exe' | sha256sum --check
          echo 'ae5feb58a3ccaca19bc56f9aaf27d21a96153ada89a97c7074e66dbe71be36a0  build/native-seeds/seven-installer-windows.exe' | sha256sum --check

      - name: Build diagnostic bundle
        shell: cmd
        run: |
          set "BUNDLE=build\diagnostic"
          mkdir "%BUNDLE%\payload\bin"
          mkdir "%BUNDLE%\payload\std"
          copy /y build\native-seeds\seven-installer-windows.exe "%BUNDLE%\seven-installer.exe"
          copy /y build\native-seeds\seven-windows.exe "%BUNDLE%\payload\bin\seven.exe"
          copy /y brand\seven.ico "%BUNDLE%\payload\seven.ico"
          copy /y brand\seven-mark.svg "%BUNDLE%\payload\seven-mark.svg"
          copy /y LICENSE "%BUNDLE%\payload\LICENSE"
          copy /y NOTICE "%BUNDLE%\payload\NOTICE"
          xcopy std "%BUNDLE%\payload\std" /E /I /Y >nul
          echo SVBC>"%BUNDLE%\payload\seven.svbc"
          echo SVBC>"%BUNDLE%\payload\seven.host.svbc"
          echo SVBC>"%BUNDLE%\payload\seven.launcher.svbc"

      - name: Diagnose installer
        shell: cmd
        continue-on-error: true
        run: |
          set "BUNDLE=%CD%\build\diagnostic"
          echo LOCALAPPDATA=%LOCALAPPDATA%
          echo APPDATA=%APPDATA%
          pushd "%BUNDLE%"
          start /wait "" ".\seven-installer.exe"
          echo INSTALL_EXIT=%ERRORLEVEL%
          popd
          echo ==== INSTALL TREE ====
          dir /s /b "%LOCALAPPDATA%\Programs\Seven" 2>nul
          echo ==== START MENU ====
          dir /s /b "%APPDATA%\Microsoft\Windows\Start Menu\Programs" | findstr /i Seven
          echo ==== FILE ASSOCIATION ====
          reg query HKCU\Software\Classes\.sev /s
          echo ==== UNINSTALL ====
          reg query HKCU\Software\Microsoft\Windows\CurrentVersion\Uninstall\Seven.Language /s
