name: Version Semantic Native Seeds

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Validate and version semantic Linux and Windows seeds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gabriell211/production-readiness
          fetch-depth: 0

      - name: Extract and correct transition generator
        shell: bash
        run: |
          set -euo pipefail
          awk '/seven-bootstrap.c.gz.b64.*B64/{capture=1;next} /^          B64$/{capture=0} capture{sub(/^          /,"");print}' .github/workflows/regenerate-semantic-seeds.yml > "$RUNNER_TEMP/seven-bootstrap.c.gz.b64"
          base64 --decode "$RUNNER_TEMP/seven-bootstrap.c.gz.b64" | gzip --decompress > "$RUNNER_TEMP/seven-bootstrap.c"
          python - <<'PY'
          from pathlib import Path
          path = Path("${{ runner.temp }}/seven-bootstrap.c")
          source = path.read_text()

          old_return = "if(!var_by(vars,nv,n)&&!func_by(funcs,nf,n)&&!known_word(n))"
          new_return = "if(!strstr(n,\".\")&&!var_by(vars,nv,n)&&!func_by(funcs,nf,n)&&!known_word(n))"
          if old_return not in source:
              raise SystemExit("semantic return-name rule not found")
          source = source.replace(old_return, new_return)

          mark_rule = 'if(streq(x->text,"marca")&&i+3<f->end){ArrayInfo*a=arr_by(arr,na,t.v[i+1].text);if(a&&streq(t.v[i+2].text,"@")&&t.v[i+3].kind==TK_NUMBER&&strtoll(t.v[i+3].text,NULL,0)>=a->size)report(&r,"SV-MEM-LIMITE",&t.v[i+3],"constant index outside array bounds");}\n'
          pega_rule = ' if(streq(x->text,"pega")){int j=i+1;while(j<f->end&&t.v[j].line==x->line&&!streq(t.v[j].text,"->"))j++;if(j+1<f->end&&streq(t.v[j].text,"->")&&t.v[j+1].kind==TK_IDENT&&!var_by(vars,nv,t.v[j+1].text)&&nv<MAX_SYMBOLS){Var*v=&vars[nv++];memset(v,0,sizeof(*v));strncpy(v->name,t.v[j+1].text,127);v->mutable_=0;v->line=x->line;}}\n'
          if mark_rule not in source:
              raise SystemExit("memory mark rule not found")
          source = source.replace(mark_rule, mark_rule + pega_rule)
          path.write_text(source)
          PY

      - name: Build semantic bootstrap binaries
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/seven-bootstrap.c"
          gcc -std=c11 -O2 -s -Wall -Wextra -Wno-unused-parameter "$src" -o "$RUNNER_TEMP/seven-linux"

          cat > "$RUNNER_TEMP/kernel32.def" <<'DEF'
          LIBRARY KERNEL32.dll
          EXPORTS
           GetCommandLineA
           ExitProcess
           GetFileAttributesA
           CreateDirectoryA
          DEF
          cat > "$RUNNER_TEMP/msvcrt.def" <<'DEF'
          LIBRARY msvcrt.dll
          EXPORTS
           malloc
           realloc
           free
           fopen
           fread
           fwrite
           fclose
           fseek
           ftell
           rewind
           strlen
           strcmp
           strncmp
           strstr
           memcpy
           memcmp
           memset
           strcpy
           strncpy
           sprintf
           _snprintf
           puts
           printf
           _strtoi64
          DEF
          link=$(command -v lld-link || command -v lld-link-18 || command -v lld-link-17)
          "$link" /dll /noentry /def:"$RUNNER_TEMP/kernel32.def" /out:"$RUNNER_TEMP/kernel32-stub.dll" /implib:"$RUNNER_TEMP/kernel32.lib"
          "$link" /dll /noentry /def:"$RUNNER_TEMP/msvcrt.def" /out:"$RUNNER_TEMP/msvcrt-stub.dll" /implib:"$RUNNER_TEMP/msvcrt.lib"
          clang --target=x86_64-pc-windows-msvc -D_WIN32 -std=c11 -O2 -ffreestanding -fno-stack-protector -fno-builtin -mno-stack-arg-probe -c "$src" -o "$RUNNER_TEMP/seven-windows.obj"
          "$link" /subsystem:console /entry:mainCRTStartup /nodefaultlib /out:"$RUNNER_TEMP/seven-windows.exe" "$RUNNER_TEMP/seven-windows.obj" "$RUNNER_TEMP/kernel32.lib" "$RUNNER_TEMP/msvcrt.lib"

      - name: Assemble deterministic seed archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/old" "$RUNNER_TEMP/new" build/semantic-seeds
          cat seed/native/final/v1/part*.b64 | tr -d '\r\n\t ' | base64 --decode > "$RUNNER_TEMP/old.zip"
          unzip -q "$RUNNER_TEMP/old.zip" -d "$RUNNER_TEMP/old"
          cp "$RUNNER_TEMP/seven-linux" "$RUNNER_TEMP/new/seven-linux"
          cp "$RUNNER_TEMP/seven-windows.exe" "$RUNNER_TEMP/new/seven-windows.exe"
          cp "$RUNNER_TEMP/old/seven-installer-linux" "$RUNNER_TEMP/new/seven-installer-linux"
          cp "$RUNNER_TEMP/old/seven-installer-windows.exe" "$RUNNER_TEMP/new/seven-installer-windows.exe"
          chmod +x "$RUNNER_TEMP/new/seven-linux" "$RUNNER_TEMP/new/seven-installer-linux"
          touch -t 202608060300.00 "$RUNNER_TEMP/new"/*
          (cd "$RUNNER_TEMP/new" && zip -X -q "$GITHUB_WORKSPACE/build/semantic-seeds/native-seeds.zip" seven-windows.exe seven-installer-windows.exe seven-linux seven-installer-linux)

      - name: Validate semantic behavior
        shell: bash
        run: |
          set -euo pipefail
          seven="$RUNNER_TEMP/new/seven-linux"
          "$seven" --version
          "$seven" check examples/hello.sev
          "$seven" build examples/hello.sev build/semantic-seeds/hello.svbc
          "$seven" run examples/hello.sev

          while IFS= read -r file; do
            "$seven" check "$file"
          done < <(find conformance -type f -path '*/valid/*.sev' | sort)

          while IFS= read -r file; do
            if "$seven" check "$file"; then
              echo "invalid source accepted: $file"
              exit 1
            fi
          done < <(find conformance -type f -path '*/invalid/*.sev' | sort)

      - name: Version archive and update audited hashes
        shell: bash
        run: |
          set -euo pipefail
          archive=build/semantic-seeds/native-seeds.zip
          archive_sha=$(sha256sum "$archive" | cut -d' ' -f1)
          linux_sha=$(sha256sum "$RUNNER_TEMP/new/seven-linux" | cut -d' ' -f1)
          windows_sha=$(sha256sum "$RUNNER_TEMP/new/seven-windows.exe" | cut -d' ' -f1)
          installer_linux_sha=$(sha256sum "$RUNNER_TEMP/new/seven-installer-linux" | cut -d' ' -f1)
          installer_windows_sha=$(sha256sum "$RUNNER_TEMP/new/seven-installer-windows.exe" | cut -d' ' -f1)

          base64 -w0 "$archive" > "$RUNNER_TEMP/native-seeds.b64"
          python - "$archive_sha" "$linux_sha" "$windows_sha" "$installer_linux_sha" "$installer_windows_sha" <<'PY'
          from pathlib import Path
          import re
          import sys

          archive, linux, windows, installer_linux, installer_windows = sys.argv[1:]
          encoded = Path("${{ runner.temp }}/native-seeds.b64").read_text()
          count = 5
          size = ((len(encoded) + count - 1) // count + 3) // 4 * 4
          root = Path("seed/native/final/v1")
          for index in range(count):
              (root / f"part{index + 1:02}.b64").write_text(encoded[index * size:(index + 1) * size])

          for name in [".github/workflows/foundation.yml", ".github/workflows/readiness.yml"]:
              path = Path(name)
              text = path.read_text()
              text = re.sub(r"[0-9a-f]{64}(?=  build/native-seeds\.zip)", archive, text)
              text = re.sub(r"[0-9a-f]{64}(?=  build/native-seeds/seven-linux)", linux, text)
              text = re.sub(r"[0-9a-f]{64}(?=  build/native-seeds/seven-windows\.exe)", windows, text)
              path.write_text(text)

          (root / "SHA256SUMS").write_text(
              f"{archive}  native-seeds.zip\n"
              f"{linux}  seven-linux\n"
              f"{windows}  seven-windows.exe\n"
              f"{installer_linux}  seven-installer-linux\n"
              f"{installer_windows}  seven-installer-windows.exe\n"
          )
          PY

      - name: Remove one-shot staging workflows
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/workflows/branch-write-test.yml \
            .github/workflows/build-semantic-seeds.yml \
            .github/workflows/build-semantic-seeds-v2.yml \
            .github/workflows/regenerate-semantic-seeds.yml \
            .github/workflows/regenerate-semantic-seeds-v2.yml \
            .github/workflows/regenerate-semantic-seeds-v3.yml \
            seed/native/final/v1/GENERATOR_READY \
            seed/native/final/v1/GENERATOR_LOG.txt

      - name: Commit validated semantic seeds
        shell: bash
        run: |
          set -euo pipefail
          git config user.name gabriell211
          git config user.email 102088315+gabriell211@users.noreply.github.com
          git add -A
          if git diff --cached --quiet; then
            echo 'validated seed archive already versioned'
            exit 0
          fi
          git commit -m 'version validated semantic native seeds'
          git push origin HEAD:gabriell211/production-readiness
