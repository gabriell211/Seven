name: Build Semantic Native Seeds v2

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build corrected semantic Linux and Windows seeds
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Extract and correct transition generator
        shell: bash
        run: |
          set -euo pipefail
          awk '/seven-bootstrap.c.gz.b64.*B64/{capture=1;next} /^          B64$/{capture=0} capture{sub(/^          /,"");print}' .github/workflows/regenerate-semantic-seeds.yml > "$RUNNER_TEMP/seven-bootstrap.c.gz.b64"
          base64 --decode "$RUNNER_TEMP/seven-bootstrap.c.gz.b64" | gzip --decompress > "$RUNNER_TEMP/seven-bootstrap.c"
          python - <<'PY'
          from pathlib import Path
          path = Path("${{ runner.temp }}/seven-bootstrap.c")
          source = path.read_text()
          old = "if(!var_by(vars,nv,n)&&!func_by(funcs,nf,n)&&!known_word(n))"
          new = "if(!strstr(n,\".\")&&!var_by(vars,nv,n)&&!func_by(funcs,nf,n)&&!known_word(n))"
          if old not in source:
              raise SystemExit("semantic return-name rule not found")
          path.write_text(source.replace(old, new))
          PY

      - name: Build semantic bootstrap binaries
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/seven-bootstrap.c"
          gcc -std=c11 -O2 -s -Wall -Wextra -Wno-unused-parameter "$src" -o "$RUNNER_TEMP/seven-linux"

          cat > "$RUNNER_TEMP/kernel32.def" <<'DEF'
          LIBRARY KERNEL32.dll
          EXPORTS
           GetCommandLineA
           ExitProcess
           GetFileAttributesA
           CreateDirectoryA
          DEF
          cat > "$RUNNER_TEMP/msvcrt.def" <<'DEF'
          LIBRARY msvcrt.dll
          EXPORTS
           malloc
           realloc
           free
           fopen
           fread
           fwrite
           fclose
           fseek
           ftell
           rewind
           strlen
           strcmp
           strncmp
           strstr
           memcpy
           memcmp
           memset
           strcpy
           strncpy
           sprintf
           _snprintf
           puts
           printf
           _strtoi64
          DEF
          link=$(command -v lld-link || command -v lld-link-18 || command -v lld-link-17)
          "$link" /dll /noentry /def:"$RUNNER_TEMP/kernel32.def" /out:"$RUNNER_TEMP/kernel32-stub.dll" /implib:"$RUNNER_TEMP/kernel32.lib"
          "$link" /dll /noentry /def:"$RUNNER_TEMP/msvcrt.def" /out:"$RUNNER_TEMP/msvcrt-stub.dll" /implib:"$RUNNER_TEMP/msvcrt.lib"
          clang --target=x86_64-pc-windows-msvc -D_WIN32 -std=c11 -O2 -ffreestanding -fno-stack-protector -fno-builtin -mno-stack-arg-probe -c "$src" -o "$RUNNER_TEMP/seven-windows.obj"
          "$link" /subsystem:console /entry:mainCRTStartup /nodefaultlib /out:"$RUNNER_TEMP/seven-windows.exe" "$RUNNER_TEMP/seven-windows.obj" "$RUNNER_TEMP/kernel32.lib" "$RUNNER_TEMP/msvcrt.lib"

      - name: Assemble deterministic seed archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/old" "$RUNNER_TEMP/new" build/semantic-seeds
          cat seed/native/final/v1/part*.b64 | tr -d '\r\n\t ' | base64 --decode > "$RUNNER_TEMP/old.zip"
          unzip -q "$RUNNER_TEMP/old.zip" -d "$RUNNER_TEMP/old"
          cp "$RUNNER_TEMP/seven-linux" "$RUNNER_TEMP/new/seven-linux"
          cp "$RUNNER_TEMP/seven-windows.exe" "$RUNNER_TEMP/new/seven-windows.exe"
          cp "$RUNNER_TEMP/old/seven-installer-linux" "$RUNNER_TEMP/new/seven-installer-linux"
          cp "$RUNNER_TEMP/old/seven-installer-windows.exe" "$RUNNER_TEMP/new/seven-installer-windows.exe"
          chmod +x "$RUNNER_TEMP/new/seven-linux" "$RUNNER_TEMP/new/seven-installer-linux"
          touch -t 202608060300.00 "$RUNNER_TEMP/new"/*
          (cd "$RUNNER_TEMP/new" && zip -X -q "$GITHUB_WORKSPACE/build/semantic-seeds/native-seeds.zip" seven-windows.exe seven-installer-windows.exe seven-linux seven-installer-linux)
          sha256sum build/semantic-seeds/native-seeds.zip > build/semantic-seeds/SHA256SUMS
          sha256sum "$RUNNER_TEMP/new/seven-linux" >> build/semantic-seeds/SHA256SUMS
          sha256sum "$RUNNER_TEMP/new/seven-windows.exe" >> build/semantic-seeds/SHA256SUMS
          sha256sum "$RUNNER_TEMP/new/seven-installer-linux" >> build/semantic-seeds/SHA256SUMS
          sha256sum "$RUNNER_TEMP/new/seven-installer-windows.exe" >> build/semantic-seeds/SHA256SUMS

      - name: Validate semantic behavior
        shell: bash
        run: |
          set -euo pipefail
          seven="$RUNNER_TEMP/new/seven-linux"
          "$seven" --version
          "$seven" check examples/hello.sev
          "$seven" build examples/hello.sev build/semantic-seeds/hello.svbc
          "$seven" run examples/hello.sev

          while IFS= read -r file; do
            "$seven" check "$file"
          done < <(find conformance -type f -path '*/valid/*.sev' | sort)

          while IFS= read -r file; do
            if "$seven" check "$file"; then
              echo "invalid source accepted: $file"
              exit 1
            fi
          done < <(find conformance -type f -path '*/invalid/*.sev' | sort)

      - uses: actions/upload-artifact@v4
        with:
          name: semantic-native-seeds-v2
          path: build/semantic-seeds/
          if-no-files-found: error
