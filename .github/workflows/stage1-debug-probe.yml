name: Seven Stage 1 Debug Probe

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seven-stage1-debug-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Run Stage 1 diagnostic pipeline
        shell: bash
        run: bash bootstrap/stage1_debug_probe.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seven-stage1-debug
          path: |
            build/stage1-debug.log
            build/stage1-debug.exit
            build/stage1-proof.svbc
            build/seven.stage1.monolith.sev
            build/seven.stage1.svbc
          if-no-files-found: warn
