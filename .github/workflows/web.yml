name: Seven WebAssembly

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seven-webassembly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  webassembly:
    name: Seven-native WebAssembly backend
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct audited Seven compiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/native-seeds
          cat seed/native/final/v1/part*.b64 | tr -d '\r\n\t ' | base64 --decode > build/native-seeds.zip
          echo '2a82e550abf403f4cdd99e2636f0e3fc2438b13d2b0a624dd674585b27f55ffd  build/native-seeds.zip' | sha256sum --check
          unzip -q build/native-seeds.zip -d build/native-seeds
          echo '7f1716529ee060b9f71dc64b147633ce79c9023ee6229b6736caefc516b8b13f  build/native-seeds/seven-linux' | sha256sum --check
          chmod +x build/native-seeds/seven-linux

      - name: Validate Seven WebAssembly sources
        shell: bash
        run: |
          set -euo pipefail
          seven=build/native-seeds/seven-linux
          "$seven" check compiler/wasm.sev
          "$seven" check compiler/toolchain/web_build.sev
          "$seven" check runtime/platform/web/target.sev
          "$seven" check runtime/platform/web/manifest.sev
          "$seven" check tests/compiler/wasm.sev

      - name: Enforce zero foreign-language implementation
        shell: bash
        run: |
          set -euo pipefail
          if find compiler compiler0 runtime std bootstrap tests/compiler \
            -type f \( -name '*.c' -o -name '*.cc' -o -name '*.cpp' -o -name '*.cxx' \
            -o -name '*.rs' -o -name '*.go' -o -name '*.py' -o -name '*.js' \
            -o -name '*.mjs' -o -name '*.ts' -o -name '*.cs' -o -name '*.java' \) \
            -print -quit | grep -q .; then
            echo 'Foreign-language implementation source detected.'
            exit 1
          fi

      - name: Verify direct WebAssembly contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'campo emite_wasm' compiler/wasm.sev
          grep -q 'wasm_secao_tipos' compiler/wasm.sev
          grep -q 'wasm_secao_imports' compiler/wasm.sev
          grep -q 'wasm_secao_codigo' compiler/wasm.sev
          grep -q 'wasm_secao_dados' compiler/wasm.sev
          grep -q 'app.wasm' compiler/toolchain/web_build.sev
          grep -q 'seven_start' compiler/toolchain/web_build.sev
          grep -q 'extensao_fonte: ".sev"' runtime/platform/web/target.sev
          ! grep -R -n 'app.svbc\|seven-runtime.js\|sys_web_empacota' \
            compiler/wasm.sev compiler/toolchain/web_build.sev runtime/platform/web

      - name: Build and execute a Seven web application
        shell: bash
        run: |
          set -euo pipefail
          seven=build/native-seeds/seven-linux
          "$seven" web build examples/hello.sev build/web
          test -s build/web/app.wasm
          test -s build/web/app.wasm.sha256
          test -s build/web/index.html
          test -s build/web/seven-loader.mjs
          test -s build/web/seven.web.json
          (cd build/web && sha256sum --check app.wasm.sha256)
          node - build/web/app.wasm <<'JS'
          const fs = require('fs');
          const bytes = fs.readFileSync(process.argv[2]);
          if (!WebAssembly.validate(bytes)) throw new Error('app.wasm invalido');

          (async () => {
            let memory;
            let output = '';
            const { instance } = await WebAssembly.instantiate(bytes, {
              seven: {
                terminal_diga(ptr, len) {
                  output += Buffer.from(memory.buffer, ptr, len).toString('utf8') + '\n';
                }
              }
            });
            memory = instance.exports.memory;
            const code = instance.exports.seven_start();
            if (code !== 0) throw new Error(`codigo inesperado: ${code}`);
            if (output !== 'Seven nasceu.\n') throw new Error(`saida inesperada: ${JSON.stringify(output)}`);
            console.log(output.trim());
          })().catch(error => {
            console.error(error);
            process.exit(1);
          });
          JS
