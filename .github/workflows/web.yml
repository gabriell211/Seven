name: Seven WebAssembly

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seven-webassembly-${{ github.ref }}
  cancel-in-progress: true

jobs:
  webassembly:
    name: Seven source-to-WebAssembly E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6

      - name: Enforce Seven-only implementation outside Genesis
        shell: bash
        run: |
          set -euo pipefail

          if find compiler compiler0 runtime std tests/compiler \
            -type f \( -name '*.c' -o -name '*.cc' -o -name '*.cpp' -o -name '*.cxx' \
            -o -name '*.rs' -o -name '*.go' -o -name '*.py' -o -name '*.js' \
            -o -name '*.mjs' -o -name '*.ts' -o -name '*.cs' -o -name '*.java' \) \
            -print -quit | grep -q .; then
            echo 'Foreign-language implementation source detected outside Genesis.'
            exit 1
          fi

          if find bootstrap -type f \
            \( -name '*.c' -o -name '*.cc' -o -name '*.cpp' -o -name '*.cxx' \
            -o -name '*.rs' -o -name '*.go' -o -name '*.py' -o -name '*.js' \
            -o -name '*.mjs' -o -name '*.ts' -o -name '*.cs' -o -name '*.java' \) \
            ! -path 'bootstrap/host/v2/genesis-host.c' -print -quit | grep -q .; then
            echo 'Unexpected foreign-language bootstrap source detected.'
            exit 1
          fi

      - name: Verify direct WebAssembly contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'campo emite_wasm' compiler/wasm.sev
          grep -q 'wasm_secao_tipos' compiler/wasm.sev
          grep -q 'wasm_secao_imports' compiler/wasm.sev
          grep -q 'wasm_secao_codigo' compiler/wasm.sev
          grep -q 'wasm_secao_dados' compiler/wasm.sev
          grep -q 'prepara_ir_web' compiler/toolchain/web_build.sev
          grep -q 'app.wasm' compiler/toolchain/web_build.sev
          grep -q 'seven_start' compiler/toolchain/web_build.sev
          grep -q 'extensao_fonte: ".sev"' runtime/platform/web/target.sev
          ! grep -R -n 'app.svbc\|seven-runtime.js\|sys_web_empacota' \
            compiler/wasm.sev compiler/web_ir.sev compiler/toolchain/web_build.sev runtime/platform/web

      - name: Run source-to-WebAssembly frontend E2E
        shell: bash
        run: bash tests/compiler/web_source_e2e.sh
