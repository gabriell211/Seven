name: Generate Deterministic Source Index

on:
  push:
    branches:
      - gabriell211/production-readiness
    paths:
      - .github/workflows/generate-source-index.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gabriell211/production-readiness
          fetch-depth: 0

      - name: Build and version source index
        run: |
          set -euo pipefail
          find compiler compiler0 runtime std bootstrap \
            -type f -name '*.sev' -print | LC_ALL=C sort > seven.sources
          test -s seven.sources
          git config user.name gabriell211
          git config user.email 102088315+gabriell211@users.noreply.github.com
          git add seven.sources
          git commit -m 'add deterministic Seven source index'
          git push origin HEAD:gabriell211/production-readiness
