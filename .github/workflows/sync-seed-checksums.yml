name: Synchronize Seven Seed Checksums

on:
  pull_request:
    paths:
      - .github/workflows/sync-seed-checksums.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seven-seed-checksum-sync
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/seven-web-build
          fetch-depth: 0

      - name: Reconstruct existing archive and calculate checksums
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/seven-seed-sync"
          rm -rf "$work"
          mkdir -p "$work/unpacked"
          cat seed/native/final/v1/part*.b64 | tr -d '\r\n\t ' | base64 --decode > "$work/native-seeds.zip"
          unzip -t "$work/native-seeds.zip"
          unzip -q "$work/native-seeds.zip" -d "$work/unpacked"
          archive=$(sha256sum "$work/native-seeds.zip" | cut -d' ' -f1)
          linux=$(sha256sum "$work/unpacked/seven-linux" | cut -d' ' -f1)
          windows=$(sha256sum "$work/unpacked/seven-windows.exe" | cut -d' ' -f1)
          installer_linux=$(sha256sum "$work/unpacked/seven-installer-linux" | cut -d' ' -f1)
          installer_windows=$(sha256sum "$work/unpacked/seven-installer-windows.exe" | cut -d' ' -f1)
          printf '%s  native-seeds.zip\n%s  seven-linux\n%s  seven-windows.exe\n%s  seven-installer-linux\n%s  seven-installer-windows.exe\n' \
            "$archive" "$linux" "$windows" "$installer_linux" "$installer_windows" \
            > seed/native/final/v1/SHA256SUMS
          cat seed/native/final/v1/SHA256SUMS

      - name: Commit checksum manifest only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name gabriell211
          git config user.email 102088315+gabriell211@users.noreply.github.com
          git add seed/native/final/v1/SHA256SUMS
          if git diff --cached --quiet; then
            echo 'checksum manifest already synchronized'
            exit 0
          fi
          git commit -m 'synchronize audited seed checksum manifest'
          git push origin HEAD:agent/seven-web-build
