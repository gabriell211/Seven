name: Finalize Seven Stage 1

on:
  pull_request:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage1-self-host-clean
          fetch-depth: 0

      - name: Install canonical Stage 1 sources and gates
        run: python bootstrap/stage1_finalize.py

      - name: Commit canonical Stage 1
        shell: bash
        run: |
          set -euo pipefail
          git config user.name seven-bootstrap-bot
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m '[stage1-final] Canonicalize Stage 1 self-hosting'
          git push origin HEAD:stage1-self-host-clean
