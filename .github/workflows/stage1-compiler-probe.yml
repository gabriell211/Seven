name: Publish Canonical Seven Stage 1 Sources

on:
  pull_request:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage1-self-host-clean
          fetch-depth: 0

      - name: Generate canonical source tree
        if: ${{ hashFiles('bootstrap/stage1_finalize.py') != '' }}
        run: python bootstrap/stage1_finalize.py

      - name: Keep workflow changes for API publication
        if: ${{ hashFiles('bootstrap/stage1_finalize.py') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          git checkout HEAD -- .github/workflows/stage0-fixed-point.yml
          git checkout HEAD -- .github/workflows/stage1-compiler-probe.yml
          git checkout HEAD -- .github/workflows/stage1-canonicalize.yml

      - name: Commit canonical sources and Genesis host
        if: ${{ hashFiles('bootstrap/stage1_finalize.py') != '' }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name seven-bootstrap-bot
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m 'Canonicalize Stage 1 sources and Genesis host'
          git push origin HEAD:stage1-self-host-clean
