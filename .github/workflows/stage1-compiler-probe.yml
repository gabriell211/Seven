name: Seven Stage 1 Self-Hosting

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seven-stage1-self-hosting-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self-host:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct the audited bootstrap
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          cat bootstrap/seed/v2/part*.b64 | tr -d '\r\n\t ' | base64 --decode | gzip --decompress > build/seven0.seed.svbc
          echo '123f5b513bcae7774671898f471441b3c71efd570acad91fa634cbc5f33bb223  build/seven0.seed.svbc' | sha256sum --check
          (cd bootstrap/host/v2 && sha256sum --check SHA256SUMS)
          gcc -O2 -std=c11 -Wall -Wextra -Werror bootstrap/host/v2/genesis-host.c -o build/genesis-host

      - name: Rebuild Seven-0 to its fixed point
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'modulo seven0_bootstrap_monolith\n\n'
            for arquivo in $(find compiler0 -maxdepth 1 -type f -name '*.sev' | LC_ALL=C sort); do
              printf '// BEGIN %s\n' "$(basename "$arquivo")"
              sed '/^modulo /d; /^usa /d' "$arquivo"
              printf '// END %s\n\n' "$(basename "$arquivo")"
            done
          } > build/seven0.monolith.sev
          build/genesis-host build/seven0.seed.svbc build/seven0.monolith.sev build/seven0.svbc
          build/genesis-host build/seven0.svbc build/seven0.monolith.sev build/seven0.self.svbc
          cmp build/seven0.svbc build/seven0.self.svbc
          test "$(od -An -tx1 -N4 build/seven0.svbc | tr -d ' \n')" = '53564230'

      - name: Generate the deterministic Stage 1 compiler source
        shell: bash
        run: |
          set -euo pipefail
          cat > build/stage1.sources <<'EOF'
          std/base/lista.sev
          std/base/resultado.sev
          std/base/talvez.sev
          std/base/mapa.sev
          std/base/texto.sev
          std/mem/bytes.sev
          std/fs/file.sev
          compiler/ast.sev
          compiler/bytecode.sev
          compiler/diagnostic.sev
          compiler/driver.sev
          compiler/effects.sev
          compiler/emitter.sev
          compiler/ffi.sev
          compiler/ir.sev
          compiler/lexer.sev
          compiler/memory.sev
          compiler/package.sev
          compiler/parser_part00.sev
          compiler/parser_part01.sev
          compiler/parser_part02.sev
          compiler/parser_part03.sev
          compiler/parser_part04.sev
          compiler/parser_part05.sev
          compiler/parser_cursor.sev
          compiler/semantic.sev
          compiler/source.sev
          compiler/symbols.sev
          compiler/token.sev
          compiler/types_part00.sev
          compiler/types_part01.sev
          compiler/types_part02.sev
          compiler/types_part03.sev
          EOF

          {
            printf 'modulo seven_stage1_monolith\n\n'
            while IFS= read -r arquivo; do
              printf '// BEGIN %s\n' "$arquivo"
              case "$arquivo" in
                compiler/bytecode.sev)
                  sed '/^modulo /d; /^usa /d; s/emite_constante(/bytecode_emite_constante(/g' "$arquivo"
                  ;;
                compiler/emitter.sev)
                  sed '/^modulo /d; /^usa /d; s/^campo emite(/campo emite_formato(/' "$arquivo"
                  ;;
                *)
                  sed '/^modulo /d; /^usa /d' "$arquivo"
                  ;;
              esac
              printf '// END %s\n\n' "$arquivo"
            done < build/stage1.sources

            cat <<'EOF'
          campo inicio(argumentos: Lista<Texto>) -> Num toca terminal, disco, ambiente ::
            guarda pedido := pedido_de_compilacao(argumentos)
            guarda saida := compila(pedido)
            veja saida e Sucesso ::
              devolve 0
            outro ::
              mostra_diagnosticos(saida.diagnosticos)
              devolve 1
            fecha
          fecha
          EOF
          } > build/seven.stage1.monolith.sev

      - name: Compile the Stage 1 compiler with Seven-0
        shell: bash
        run: |
          set -euo pipefail
          build/genesis-host build/seven0.svbc build/seven.stage1.monolith.sev build/seven.stage1.svbc
          test -s build/seven.stage1.svbc
          test "$(od -An -tx1 -N4 build/seven.stage1.svbc | tr -d ' \n')" = '53564230'

      - name: Compile and execute a fresh package with Stage 1
        shell: bash
        run: |
          set -euo pipefail
          cat > build/stage1-proof.sev <<'EOF'
          modulo stage1.prova

          campo inicio() -> Num ::
            devolve 42
          fecha
          EOF
          printf '%s\n' 'build/stage1-proof.sev' > build/stage1-proof.sources
          cat > build/stage1-proof.pkg <<'EOF'
          pacote stage1-proof
          versao 0.0.1
          criador Gabriel Barcelos
          entrada stage1.prova.inicio
          alvo svbc
          indice build/stage1-proof.sources
          EOF
          build/genesis-host build/seven.stage1.svbc build/stage1-proof.pkg build/stage1-proof.svbc
          test -s build/stage1-proof.svbc
          test "$(od -An -tx1 -N4 build/stage1-proof.svbc | tr -d ' \n')" = '53564243'
          set +e
          build/genesis-host build/stage1-proof.svbc
          proof_exit=$?
          set -e
          test "$proof_exit" -eq 42

      - name: Rebuild the compiler to the Stage 2 fixed point
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' 'build/seven.stage1.monolith.sev' > build/stage2.sources
          cat > build/stage2.pkg <<'EOF'
          pacote seven-stage2
          versao 0.0.1
          criador Gabriel Barcelos
          entrada seven_stage1_monolith.inicio
          alvo svbc
          indice build/stage2.sources
          EOF
          build/genesis-host build/seven.stage1.svbc build/stage2.pkg build/seven.stage2.svbc
          echo 'stage2 generated'
          build/genesis-host build/seven.stage2.svbc build/stage2.pkg build/seven.stage2.self.svbc
          echo 'stage2 self generated'
          stage2_hash=$(sha256sum build/seven.stage2.svbc | awk '{print $1}')
          stage2_self_hash=$(sha256sum build/seven.stage2.self.svbc | awk '{print $1}')
          echo "stage2_sha256=$stage2_hash"
          echo "stage2_self_sha256=$stage2_self_hash"
          if ! cmp build/seven.stage2.svbc build/seven.stage2.self.svbc; then
            echo 'Stage2 fixed-point mismatch'
            cmp -l build/seven.stage2.svbc build/seven.stage2.self.svbc | head -20 || true
            exit 1
          fi
          test "$stage2_hash" = '68897b5275d93f6599e31d5b8c8c5b36b78e329cb433b0b120e92242251c1f6a'
          build/genesis-host build/seven.stage2.svbc build/stage1-proof.pkg build/stage2-proof.svbc
          cmp build/stage1-proof.svbc build/stage2-proof.svbc
          set +e
          build/genesis-host build/stage2-proof.svbc
          proof_exit=$?
          set -e
          test "$proof_exit" -eq 42

      - name: Record Stage 1 provenance
        shell: bash
        run: |
          set -euo pipefail
          host_source_hash=$(cat bootstrap/host/v2/genesis-host.c bootstrap/host/v2/genesis-host.part*.inc | sha256sum | awk '{print $1}')
          stage0_hash=$(sha256sum build/seven0.svbc | awk '{print $1}')
          source_hash=$(sha256sum build/seven.stage1.monolith.sev | awk '{print $1}')
          stage1_hash=$(sha256sum build/seven.stage1.svbc | awk '{print $1}')
          stage2_hash=$(sha256sum build/seven.stage2.svbc | awk '{print $1}')
          proof_hash=$(sha256sum build/stage1-proof.svbc | awk '{print $1}')
          cat > build/stage1.provenance <<EOF
          formato seven-bootstrap-provenance-v2
          etapa stage1
          host_fontes bootstrap/host/v2
          host_fontes_sha256 $host_source_hash
          executor build/seven0.svbc
          executor_sha256 $stage0_hash
          entrada build/seven.stage1.monolith.sev
          entrada_sha256 $source_hash
          saida build/seven.stage1.svbc
          saida_sha256 $stage1_hash
          autorebuild build/seven.stage2.svbc
          autorebuild_sha256 $stage2_hash
          prova build/stage1-proof.svbc
          prova_sha256 $proof_hash
          prova_exit 42
          fixed_point sim
          EOF
          cat build/stage1.provenance

      - uses: actions/upload-artifact@v4
        with:
          name: seven-stage1-self-hosting
          path: |
            build/seven0.svbc
            build/seven0.self.svbc
            build/seven.stage1.monolith.sev
            build/seven.stage1.svbc
            build/seven.stage2.svbc
            build/seven.stage2.self.svbc
            build/stage1-proof.svbc
            build/stage2-proof.svbc
            build/stage1.provenance
          if-no-files-found: error
