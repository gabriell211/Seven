name: Seven Stage 1 Compiler Probe

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seven-stage1-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct autonomous Seven-0
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build

          cat bootstrap/seed/v2/part*.b64 | tr -d '\r\n\t ' | base64 --decode | gzip --decompress > build/seven0.seed.svbc
          echo '123f5b513bcae7774671898f471441b3c71efd570acad91fa634cbc5f33bb223  build/seven0.seed.svbc' | sha256sum --check

          base64 --decode bootstrap/staging/genesis-host.c.gz.b64 | gzip --decompress > build/genesis-host.c
          echo '2f71509466eee470a5379d750b067a7e1733c0a4c1c8dd56542eb6bd5d0ec1d1  build/genesis-host.c' | sha256sum --check
          gcc -O2 -std=c11 -Wall -Wextra -Werror build/genesis-host.c -o build/genesis-host

          {
            printf 'modulo seven0_bootstrap_monolith\n\n'
            for arquivo in $(find compiler0 -maxdepth 1 -type f -name '*.sev' | LC_ALL=C sort); do
              printf '// BEGIN %s\n' "$(basename "$arquivo")"
              sed '/^modulo /d; /^usa /d' "$arquivo"
              printf '// END %s\n\n' "$(basename "$arquivo")"
            done
          } > build/seven0.monolith.sev

          build/genesis-host build/seven0.seed.svbc build/seven0.monolith.sev build/seven0.svbc
          build/genesis-host build/seven0.svbc build/seven0.monolith.sev build/seven0.self.svbc
          cmp build/seven0.svbc build/seven0.self.svbc
          sha256sum build/seven0.svbc | tee build/seven0-stage1.sha256
          wc -c build/seven0.svbc | tee build/seven0-stage1.size

      - name: Generate deterministic Stage 1 compiler monolith
        shell: bash
        run: |
          set -euo pipefail
          cat > build/stage1.sources <<'EOF'
          compiler/ast.sev
          compiler/bytecode.sev
          compiler/diagnostic.sev
          compiler/driver.sev
          compiler/effects.sev
          compiler/emitter.sev
          compiler/ffi.sev
          compiler/ir.sev
          compiler/lexer.sev
          compiler/memory.sev
          compiler/package.sev
          compiler/parser.sev
          compiler/parser_cursor.sev
          compiler/semantic.sev
          compiler/source.sev
          compiler/symbols.sev
          compiler/token.sev
          compiler/types.sev
          EOF

          {
            printf 'modulo seven_stage1_monolith\n\n'
            while IFS= read -r arquivo; do
              printf '// BEGIN %s\n' "$arquivo"
              case "$arquivo" in
                compiler/bytecode.sev)
                  sed '/^modulo /d; /^usa /d; s/emite_constante(/bytecode_emite_constante(/g' "$arquivo"
                  ;;
                compiler/emitter.sev)
                  sed '/^modulo /d; /^usa /d; s/^campo emite(/campo emite_formato(/' "$arquivo"
                  ;;
                *)
                  sed '/^modulo /d; /^usa /d' "$arquivo"
                  ;;
              esac
              printf '// END %s\n\n' "$arquivo"
            done < build/stage1.sources

            cat <<'EOF'
          campo inicio(argumentos: Lista<Texto>) -> Num toca terminal, disco, ambiente ::
            guarda pedido := pedido_de_compilacao(argumentos)
            guarda saida := compila(pedido)

            veja saida e Sucesso ::
              devolve 0
            outro ::
              mostra_diagnosticos(saida.diagnosticos)
              devolve 1
            fecha
          fecha
          EOF
          } > build/seven.stage1.monolith.sev

          sha256sum build/seven.stage1.monolith.sev | tee build/stage1-source.sha256
          wc -c build/seven.stage1.monolith.sev | tee build/stage1-source.size

      - name: Compile the core Seven compiler with Seven-0
        shell: bash
        run: |
          set +e
          set -uo pipefail
          build/genesis-host build/seven0.svbc build/seven.stage1.monolith.sev build/seven.stage1.svbc 2>&1 | tee build/stage1-compile.log
          code=${PIPESTATUS[0]}
          printf '%s\n' "$code" > build/stage1-compile.exit
          exit 0

      - name: Record Stage 1 evidence
        if: always()
        shell: bash
        run: |
          set -u
          echo 'exit:'
          cat build/stage1-compile.exit || true
          echo 'log:'
          cat build/stage1-compile.log || true
          if test -f build/seven.stage1.svbc; then
            wc -c build/seven.stage1.svbc
            sha256sum build/seven.stage1.svbc
            od -An -tx1 -N16 build/seven.stage1.svbc
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: seven-stage1-compiler-probe
          path: |
            compiler0/check.sev
            compiler0/parse.sev
            compiler0/emit.sev
            build/seven0-stage1.sha256
            build/seven0-stage1.size
            build/stage1.sources
            build/seven.stage1.monolith.sev
            build/stage1-source.sha256
            build/stage1-source.size
            build/stage1-compile.log
            build/stage1-compile.exit
            build/seven.stage1.svbc
          if-no-files-found: warn
