name: Patch Seven-0 Constructor Detection

on:
  push:
    branches:
      - agent/stage1-self-host

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[constructor-patched]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage1-self-host
      - name: Replace unsupported byte lookup
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('compiler0/check.sev')
          text = path.read_text()
          old = '''campo nome_construtor(nome: Texto) -> Bit ::
            veja texto_tamanho(nome) == 0 :: devolve nao fecha
            guarda primeiro := texto_byte(nome, 0)
            devolve primeiro >= 65 e primeiro <= 90
          fecha'''
          new = '''campo nome_construtor(nome: Texto) -> Bit ::
            veja texto_tamanho(nome) == 0 :: devolve nao fecha
            devolve sys_texto_contem("ABCDEFGHIJKLMNOPQRSTUVWXYZ", texto_caractere(nome, 0))
          fecha'''
          if old not in text:
              raise SystemExit('constructor helper not found')
          path.write_text(text.replace(old, new))
          PY
          rm .github/workflows/stage1-patch-constructor.yml
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name seven-bootstrap-bot
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m '[constructor-patched] Use supported text character intrinsic'
          git push origin HEAD:agent/stage1-self-host
