name: Patch Bytecode Checker Compatibility

on:
  push:
    branches:
      - gabriell211/production-readiness
    paths:
      - .github/workflows/patch-bytecode-checker-compat.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gabriell211/production-readiness
          fetch-depth: 0
      - run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('compiler/bytecode.sev')
          text = path.read_text()

          chama_old = '''  veja instrucao e IrChama ::
    guarda deslocamento := emite_argumentos(bytes, instrucao.argumentos, ip)
    emite_instrucao_svbc(
      bytes,
      Chama,
      indice_campo(unidade.campos, instrucao.campo),
      U32(lista_tamanho(instrucao.argumentos)),
      0,
      ip + deslocamento
    )
    emite_instrucao_svbc(bytes, Guarda, instrucao.destino, 0, 0, ip + deslocamento + 1)
    devolve nulo
  fecha
'''
          chama_new = chama_old.replace('deslocamento', 'deslocamento_chamada')

          syscall_old = '''  veja instrucao e IrSyscall ::
    guarda deslocamento := emite_argumentos(bytes, instrucao.argumentos, ip)
    emite_instrucao_svbc(
      bytes,
      Syscall,
      indice_nome(unidade.nomes, instrucao.nome),
      U32(lista_tamanho(instrucao.argumentos)),
      0,
      ip + deslocamento
    )
    emite_instrucao_svbc(bytes, Guarda, instrucao.destino, 0, 0, ip + deslocamento + 1)
    devolve nulo
  fecha
'''
          syscall_new = syscall_old.replace('deslocamento', 'deslocamento_syscall')

          fallback_old = '''  veja operador == ">=" :: devolve MaiorIgual fecha
  devolve Pare
fecha
'''
          fallback_new = '''  veja operador == ">=" :: devolve MaiorIgual fecha
  guarda padrao: Opcode := Pare
  devolve padrao
fecha
'''

          for old, new in [(chama_old, chama_new), (syscall_old, syscall_new), (fallback_old, fallback_new)]:
              if old not in text:
                  raise SystemExit('expected bytecode block not found')
              text = text.replace(old, new)

          path.write_text(text)
          PY
          git config user.name gabriell211
          git config user.email 102088315+gabriell211@users.noreply.github.com
          git add compiler/bytecode.sev
          git commit -m 'remove bytecode checker ambiguities'
          git push origin HEAD:gabriell211/production-readiness
