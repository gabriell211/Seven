name: Diagnose Seven Windows Seed

on:
  pull_request:
    paths:
      - .github/workflows/diagnose-windows-seed.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct Windows seed
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/native-seeds
          cat seed/native/final/v1/part*.b64 | tr -d '\r\n\t ' | base64 --decode > build/native-seeds.zip
          echo 'd25766cb65f04630f3b585e7fa4fe6a77686ed0174fa04d6f63dd8dccfaa6c6f  build/native-seeds.zip' | sha256sum --check
          unzip -q build/native-seeds.zip -d build/native-seeds
          echo 'ace5ea9e06c9c823e56e547d7af581885f4b4401de17bb87ae5ce8b8ba04b596  build/native-seeds/seven-windows.exe' | sha256sum --check

      - name: Probe Windows process behavior
        shell: pwsh
        run: |
          $seven = Join-Path $PWD 'build/native-seeds/seven-windows.exe'
          Copy-Item examples/hello.sev hello.sev
          $cases = @(
            @('--version'),
            @('doctor'),
            @('verify', 'foundation'),
            @('check', 'arquivo-inexistente.sev'),
            @('check', 'hello.sev'),
            @('run', 'hello.sev'),
            @('web', 'build', 'hello.sev', 'build/web-diagnostic')
          )
          foreach ($case in $cases) {
            Write-Host ('COMMAND: seven ' + ($case -join ' '))
            & $seven @case
            Write-Host ('EXIT: ' + $LASTEXITCODE)
          }
          exit 0
