name: Seven Current Self-Hosted Release Gate

on:
  workflow_dispatch:
  push:
    tags:
      - 'v1.0.0'
      - 'v1.0.0-rc*'

permissions:
  contents: read

jobs:
  selfhost:
    name: Materialize self-hosted Seven release toolchain
    uses: ./.github/workflows/stage1-compiler-probe.yml

  verify:
    name: Verify self-hosted release artifacts
    needs: selfhost
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: seven-stage1-self-hosting
          path: build

      - name: Verify fixed point and release payload
        shell: bash
        run: |
          set -euo pipefail
          cmp build/seven.stage2.svbc build/seven.stage2.self.svbc
          test -s build/seven.svbc
          test -s build/seven.host.svbc
          test -s build/seven.launcher.svbc
          test -s build/seven.webbuild.svbc
          test -s build/seven.webserve.svbc
          test -s build/native/windows/seven.exe
          test -s build/native/linux/seven
          test "$(od -An -tx1 -N2 build/native/windows/seven.exe | tr -d ' \n')" = '4d5a'
          test "$(od -An -tx1 -N4 build/native/linux/seven | tr -d ' \n')" = '7f454c46'
          test -s build/installers/seven-0.1.0-windows-x64/seven-installer.exe
          test -s build/installers/seven-0.1.0-linux-x64/seven-installer

          chmod +x build/native/linux/seven
          build/native/linux/seven --version
          build/native/linux/seven doctor
          build/native/linux/seven check examples/hello.sev

      - name: Record self-hosted release checksums
        shell: bash
        run: |
          set -euo pipefail
          sha256sum             build/seven.stage2.svbc             build/seven.svbc             build/native/windows/seven.exe             build/native/linux/seven             build/installers/seven-0.1.0-windows-x64/seven-installer.exe             build/installers/seven-0.1.0-linux-x64/seven-installer             | tee build/self-hosted-release.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: seven-self-hosted-release-candidate
          path: |
            build/self-hosted-release.sha256
            build/native/
            build/installers/
            build/seven.svbc
            build/seven.host.svbc
            build/seven.launcher.svbc
            build/seven.webbuild.svbc
            build/seven.webserve.svbc
          if-no-files-found: error
