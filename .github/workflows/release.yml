name: Seven Current Self-Hosted Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v0.2.3'
      - 'v1.0.0-rc*'
      - 'v1.0.0'
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/actions/self-hosted-seven/**'
      - 'bootstrap/**'
      - 'compiler/**'
      - 'runtime/**'
      - 'std/**'

permissions:
  contents: read

jobs:
  linux:
    name: Package Linux x64 from current self-hosted chain
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Build current self-hosted Seven
        uses: ./.github/actions/self-hosted-seven

      - name: Assemble Linux package
        shell: bash
        run: |
          set -euo pipefail
          root=build/release-linux/seven-current-linux-x64
          mkdir -p "$root/bin" "$root/std" "$root/brand"

          install -m 0755 build/current-seven/bin/seven "$root/bin/seven"
          install -m 0644 build/current-seven/bin/seven.stage2.svbc "$root/bin/"
          install -m 0644 build/current-seven/bin/seven.launcher.svbc "$root/bin/"
          install -m 0644 build/current-seven/bin/seven.webbuild.svbc "$root/bin/"
          install -m 0644 build/current-seven/bin/seven.webserve.svbc "$root/bin/"
          install -m 0644 build/current-seven/PROVENANCE "$root/PROVENANCE"
          install -m 0644 LICENSE NOTICE "$root/"
          cp -R std/. "$root/std/"
          cp brand/seven.ico brand/seven-mark.svg "$root/brand/"

          (
            cd "$root"
            sha256sum bin/* > SHA256SUMS
          )

          tar -C build/release-linux -czf build/seven-current-linux-x64.tar.gz seven-current-linux-x64
          sha256sum build/seven-current-linux-x64.tar.gz > build/seven-current-linux-x64.tar.gz.sha256

      - name: Exercise packaged Linux compiler
        shell: bash
        run: |
          set -euo pipefail
          seven="$PWD/build/release-linux/seven-current-linux-x64/bin/seven"
          "$seven" --version
          "$seven" doctor
          "$seven" check examples/hello.sev
          "$seven" build examples/hello.sev build/release-linux-hello.svbc
          "$seven" web build examples/web_dev.sev build/release-linux-web
          test -s build/release-linux-hello.svbc
          test -s build/release-linux-web/app.wasm
          grep -q '^transition_seed nao$' build/release-linux/seven-current-linux-x64/PROVENANCE

      - uses: actions/upload-artifact@v4
        with:
          name: seven-current-linux-x64
          path: |
            build/seven-current-linux-x64.tar.gz
            build/seven-current-linux-x64.tar.gz.sha256
          if-no-files-found: error

  windows:
    name: Package Windows x64 from current self-hosted chain
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Build current self-hosted Seven
        uses: ./.github/actions/self-hosted-seven

      - name: Assemble Windows package
        shell: bash
        run: |
          set -euo pipefail
          root=build/release-windows/seven-current-windows-x64
          mkdir -p "$root/bin" "$root/std" "$root/brand"

          cp build/current-seven/bin/seven.exe "$root/bin/seven.exe"
          cp build/current-seven/bin/seven.stage2.svbc "$root/bin/"
          cp build/current-seven/bin/seven.launcher.svbc "$root/bin/"
          cp build/current-seven/bin/seven.webbuild.svbc "$root/bin/"
          cp build/current-seven/bin/seven.webserve.svbc "$root/bin/"
          cp build/current-seven/PROVENANCE "$root/PROVENANCE"
          cp LICENSE NOTICE "$root/"
          cp -R std/. "$root/std/"
          cp brand/seven.ico brand/seven-mark.svg "$root/brand/"

          (
            cd "$root"
            sha256sum bin/* > SHA256SUMS
          )

          7z a -tzip build/seven-current-windows-x64.zip "./$root/*"
          sha256sum build/seven-current-windows-x64.zip > build/seven-current-windows-x64.zip.sha256

      - name: Exercise packaged Windows compiler
        shell: bash
        run: |
          set -euo pipefail
          seven="$PWD/build/release-windows/seven-current-windows-x64/bin/seven.exe"
          "$seven" --version
          "$seven" doctor
          "$seven" check examples/hello.sev
          "$seven" build examples/hello.sev build/release-windows-hello.svbc
          "$seven" web build examples/web_dev.sev build/release-windows-web
          test -s build/release-windows-hello.svbc
          test -s build/release-windows-web/app.wasm
          grep -q '^transition_seed nao$' build/release-windows/seven-current-windows-x64/PROVENANCE

      - uses: actions/upload-artifact@v4
        with:
          name: seven-current-windows-x64
          path: |
            build/seven-current-windows-x64.zip
            build/seven-current-windows-x64.zip.sha256
          if-no-files-found: error

  boundary:
    name: Reject transition compiler in current release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify current release boundary
        shell: bash
        run: |
          set -euo pipefail
          if grep -n 'seed/native/final/v1' .github/workflows/release.yml; then
            echo 'Current release still references archived transition compiler.'
            exit 1
          fi
          grep -q 'self-hosted-seven' .github/workflows/release.yml
