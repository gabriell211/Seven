name: Seven Stage 1 Source Snapshot

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-artifact@v4
        with:
          name: seven-stage1-source-snapshot
          path: |
            compiler0/check.sev
            compiler0/parse.sev
            compiler0/emit.sev
          if-no-files-found: error
