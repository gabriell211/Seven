name: Seven Self-Hosted CLI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seven-self-hosted-cli-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Build self-hosted CLI bundle
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct audited bootstrap
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          cat bootstrap/seed/v2/part*.b64 | tr -d '\r\n\t ' | base64 --decode | gzip --decompress > build/seven0.seed.svbc
          echo '123f5b513bcae7774671898f471441b3c71efd570acad91fa634cbc5f33bb223  build/seven0.seed.svbc' | sha256sum --check
          (cd bootstrap/host/v2 && sha256sum --check SHA256SUMS)
          gcc -O2 -std=c11 -Wall -Wextra -Werror bootstrap/host/v2/genesis-host.c -o build/genesis-host

      - name: Rebuild Seven-0 fixed point
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'modulo seven0_bootstrap_monolith\n\n'
            for arquivo in $(find compiler0 -maxdepth 1 -type f -name '*.sev' | LC_ALL=C sort); do
              printf '// BEGIN %s\n' "$(basename "$arquivo")"
              sed '/^modulo /d; /^usa /d' "$arquivo"
              printf '// END %s\n\n' "$(basename "$arquivo")"
            done
          } > build/seven0.monolith.sev
          build/genesis-host build/seven0.seed.svbc build/seven0.monolith.sev build/seven0.svbc
          build/genesis-host build/seven0.svbc build/seven0.monolith.sev build/seven0.self.svbc
          cmp build/seven0.svbc build/seven0.self.svbc

      - name: Build Stage 1 and Stage 2
        shell: bash
        run: |
          set -euo pipefail
          cat > build/stage1.sources <<'EOF'
          std/base/lista.sev
          std/base/resultado.sev
          std/base/talvez.sev
          std/base/mapa.sev
          std/base/texto.sev
          std/mem/bytes.sev
          std/fs/file.sev
          compiler/ast.sev
          compiler/bytecode.sev
          compiler/diagnostic.sev
          compiler/driver.sev
          compiler/effects.sev
          compiler/emitter.sev
          compiler/ffi.sev
          compiler/ir.sev
          compiler/lexer.sev
          compiler/memory.sev
          compiler/package.sev
          compiler/parser_part00.sev
          compiler/parser_part01.sev
          compiler/parser_part02.sev
          compiler/parser_part03.sev
          compiler/parser_part04.sev
          compiler/parser_part05.sev
          compiler/parser_cursor.sev
          compiler/semantic.sev
          compiler/source.sev
          compiler/symbols.sev
          compiler/token.sev
          compiler/types_part00.sev
          compiler/types_part01.sev
          compiler/types_part02.sev
          compiler/types_part03.sev
          EOF

          {
            printf 'modulo seven_stage1_monolith\n\n'
            while IFS= read -r arquivo; do
              printf '// BEGIN %s\n' "$arquivo"
              case "$arquivo" in
                compiler/bytecode.sev)
                  sed '/^modulo /d; /^usa /d; s/emite_constante(/bytecode_emite_constante(/g' "$arquivo"
                  ;;
                compiler/emitter.sev)
                  sed '/^modulo /d; /^usa /d; s/^campo emite(/campo emite_formato(/' "$arquivo"
                  ;;
                *)
                  sed '/^modulo /d; /^usa /d' "$arquivo"
                  ;;
              esac
              printf '// END %s\n\n' "$arquivo"
            done < build/stage1.sources
            cat <<'EOF'
          campo inicio(argumentos: Lista<Texto>) -> Num toca terminal, disco, ambiente ::
            guarda pedido := pedido_de_compilacao(argumentos)
            guarda saida := compila(pedido)
            veja saida e Sucesso ::
              devolve 0
            outro ::
              mostra_diagnosticos(saida.diagnosticos)
              devolve 1
            fecha
          fecha
          EOF
          } > build/seven.stage1.monolith.sev

          build/genesis-host build/seven0.svbc build/seven.stage1.monolith.sev build/seven.stage1.svbc

          printf '%s\n' 'build/seven.stage1.monolith.sev' > build/stage2.sources
          cat > build/stage2.pkg <<'EOF'
          pacote seven-stage2
          versao 0.0.1
          criador Gabriel Barcelos
          entrada seven_stage1_monolith.inicio
          alvo svbc
          indice build/stage2.sources
          EOF

          build/genesis-host build/seven.stage1.svbc build/stage2.pkg build/seven.stage2.svbc
          build/genesis-host build/seven.stage2.svbc build/stage2.pkg build/seven.stage2.self.svbc
          cmp build/seven.stage2.svbc build/seven.stage2.self.svbc

      - name: Build current launcher and Web command images with Stage 2
        shell: bash
        run: |
          set -euo pipefail
          build/genesis-host build/seven.stage2.svbc runtime/launcher/seven.sev build/seven.launcher.svbc
          build/genesis-host build/seven.stage2.svbc runtime/webbuild/seven.pkg build/seven.webbuild.svbc
          build/genesis-host build/seven.stage2.svbc runtime/webserve/seven.pkg build/seven.webserve.svbc
          for image in seven.stage2.svbc seven.launcher.svbc seven.webbuild.svbc seven.webserve.svbc; do
            test -s "build/$image"
            test "$(od -An -tx1 -N4 "build/$image" | tr -d ' \n')" = '53564243'
          done

      - name: Assemble portable Linux CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/selfhost-cli-linux
          install -m 0755 build/genesis-host build/selfhost-cli-linux/seven
          install -m 0644 build/seven.stage2.svbc build/selfhost-cli-linux/
          install -m 0644 build/seven.launcher.svbc build/selfhost-cli-linux/
          install -m 0644 build/seven.webbuild.svbc build/selfhost-cli-linux/
          install -m 0644 build/seven.webserve.svbc build/selfhost-cli-linux/
          sha256sum build/selfhost-cli-linux/* > build/selfhost-cli-linux/SHA256SUMS

      - name: Exercise portable stable CLI outside repository root
        shell: bash
        run: |
          set -euo pipefail
          smoke="$RUNNER_TEMP/seven-selfhost-smoke"
          rm -rf "$smoke"
          mkdir -p "$smoke/build"
          cat > "$smoke/app.sev" <<'EOF'
          modulo smoke.app
          campo inicio() -> Num ::
            devolve 42
          fecha
          EOF
          printf '%s\n' 'app.sev' > "$smoke/app.sources"
          cat > "$smoke/app.pkg" <<'EOF'
          pacote smoke-app
          versao 0.0.1
          criador Seven CI
          entrada smoke.app.inicio
          alvo svbc
          indice app.sources
          EOF

          seven="$GITHUB_WORKSPACE/build/selfhost-cli-linux/seven"
          cd "$smoke"

          "$seven" --version
          "$seven" doctor
          "$seven" check app.pkg
          "$seven" build app.pkg build/app.svbc
          test -s build/app.svbc
          test "$(od -An -tx1 -N4 build/app.svbc | tr -d ' \n')" = '53564243'

          set +e
          "$seven" run app.pkg
          run_exit=$?
          set -e
          test "$run_exit" -eq 42

          "$seven" web build "$GITHUB_WORKSPACE/examples/web_dev.sev" build/web
          test -s build/web/app.wasm
          test -s build/web/seven.web.json

      - name: Run conformance through self-hosted CLI
        shell: bash
        run: |
          set -euo pipefail
          seven="$GITHUB_WORKSPACE/build/selfhost-cli-linux/seven"
          cd "$GITHUB_WORKSPACE"

          while IFS= read -r file; do
            echo "valid: $file"
            "$seven" check "$file"
          done < <(find conformance -type f -path '*/valid/*.sev' | LC_ALL=C sort)

          while IFS= read -r file; do
            echo "invalid: $file"
            if "$seven" check "$file"; then
              echo "invalid conformance file accepted: $file"
              exit 1
            fi
          done < <(find conformance -type f -path '*/invalid/*.sev' | LC_ALL=C sort)

      - uses: actions/upload-artifact@v4
        with:
          name: seven-self-hosted-cli
          path: |
            build/selfhost-cli-linux/
            build/seven.stage2.svbc
            build/seven.stage2.self.svbc
          if-no-files-found: error

  windows:
    name: Exercise portable Windows CLI
    needs: linux
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Verify audited bootstrap host sources
        shell: bash
        run: |
          set -euo pipefail
          (cd bootstrap/host/v2 && sha256sum --check SHA256SUMS)

      - uses: actions/download-artifact@v4
        with:
          name: seven-self-hosted-cli
          path: build/selfhost-artifact

      - name: Assemble portable Windows CLI
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/selfhost-cli-windows
          clang -D_CRT_SECURE_NO_WARNINGS -O2 -std=c11 -Wall -Wextra -Werror bootstrap/host/v2/genesis-host.c -lws2_32 -o build/selfhost-cli-windows/seven.exe
          cp build/selfhost-artifact/seven.stage2.svbc build/selfhost-cli-windows/
          cp build/selfhost-artifact/selfhost-cli-linux/seven.launcher.svbc build/selfhost-cli-windows/
          cp build/selfhost-artifact/selfhost-cli-linux/seven.webbuild.svbc build/selfhost-cli-windows/
          cp build/selfhost-artifact/selfhost-cli-linux/seven.webserve.svbc build/selfhost-cli-windows/

      - name: Exercise portable stable CLI on Windows
        shell: bash
        run: |
          set -euo pipefail
          smoke="$RUNNER_TEMP/seven-selfhost-smoke"
          rm -rf "$smoke"
          mkdir -p "$smoke/build"
          cat > "$smoke/app.sev" <<'EOF'
          modulo smoke.app
          campo inicio() -> Num ::
            devolve 42
          fecha
          EOF
          printf '%s\n' 'app.sev' > "$smoke/app.sources"
          cat > "$smoke/app.pkg" <<'EOF'
          pacote smoke-app
          versao 0.0.1
          criador Seven CI
          entrada smoke.app.inicio
          alvo svbc
          indice app.sources
          EOF

          seven="$GITHUB_WORKSPACE/build/selfhost-cli-windows/seven.exe"
          cd "$smoke"

          "$seven" --version
          "$seven" doctor
          "$seven" check app.pkg
          "$seven" build app.pkg build/app.svbc
          test -s build/app.svbc

          set +e
          "$seven" run app.pkg
          run_exit=$?
          set -e
          test "$run_exit" -eq 42

          "$seven" web build "$GITHUB_WORKSPACE/examples/web_dev.sev" build/web
          test -s build/web/app.wasm
          test -s build/web/seven.web.json
