name: Seven Official Pages

on:
  push:
    branches:
      - main
    paths:
      - 'website/**'
      - 'brand/**'
      - 'seed/native/final/v1/**'
      - '.github/workflows/pages.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'brand/**'
      - 'seed/native/final/v1/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: seven-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Generate official website with Seven
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Reconstruct audited Seven compiler
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/native-seeds
          cat seed/native/final/v1/part*.b64 | tr -d '\r\n\t ' | base64 --decode > build/native-seeds.zip
          echo '670646ab39df2f2a111c664e16023af3ddc3b203982945609193da99d8c4bac7  build/native-seeds.zip' | sha256sum --check
          unzip -q build/native-seeds.zip -d build/native-seeds
          echo '156bb5f78286431db7813d932bdf2835029ee706e1de61829ca42be81abf5802  build/native-seeds/seven-linux' | sha256sum --check
          chmod +x build/native-seeds/seven-linux

      - name: Check Seven website generator
        shell: bash
        run: |
          set -euo pipefail
          build/native-seeds/seven-linux check website/pages.sev

      - name: Generate static Pages artifact with Seven
        shell: bash
        run: |
          set -euo pipefail
          seven=build/native-seeds/seven-linux
          mkdir -p build/pages/assets

          "$seven" run website/pages.sev > build/pages/raw-output.txt
          awk '/^<!doctype html>/{emit=1} emit{print} /^<\/html>/{exit}' \
            build/pages/raw-output.txt > build/pages/index.html

          cp brand/seven-logo.svg build/pages/assets/seven-logo.svg
          touch build/pages/.nojekyll
          rm build/pages/raw-output.txt

          test -s build/pages/index.html
          test -s build/pages/assets/seven-logo.svg
          test "$(head -n 1 build/pages/index.html)" = '<!doctype html>'
          grep -q '<title>Seven — linguagem de sistemas e aplicacoes</title>' build/pages/index.html
          grep -q 'Controle de baixo nivel' build/pages/index.html
          grep -q 'website/pages.sev' build/pages/index.html
          grep -q 'issue #30' build/pages/index.html
          test "$(tail -n 1 build/pages/index.html)" = '</html>'

          echo "Seven Pages generated: $(wc -c < build/pages/index.html) bytes"

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: build/pages
          include-hidden-files: true

  deploy:
    name: Deploy official website
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
