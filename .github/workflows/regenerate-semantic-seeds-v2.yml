name: Regenerate Semantic Native Seeds v2

on:
  push:
    branches:
      - gabriell211/production-readiness
    paths:
      - .github/workflows/regenerate-semantic-seeds-v2.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gabriell211/production-readiness
          fetch-depth: 0

      - name: Extract audited transition generator
        shell: bash
        run: |
          set -euo pipefail
          awk '/seven-bootstrap.c.gz.b64.*B64/{capture=1;next} /^          B64$/{capture=0} capture{sub(/^          /,"");print}' .github/workflows/regenerate-semantic-seeds.yml > "$RUNNER_TEMP/seven-bootstrap.c.gz.b64"
          base64 --decode "$RUNNER_TEMP/seven-bootstrap.c.gz.b64" | gzip --decompress > "$RUNNER_TEMP/seven-bootstrap.c"
          test -s "$RUNNER_TEMP/seven-bootstrap.c"

      - name: Build semantic bootstrap binaries
        shell: bash
        run: |
          set -euo pipefail
          src="$RUNNER_TEMP/seven-bootstrap.c"
          gcc -std=c11 -O2 -s -Wall -Wextra -Wno-unused-parameter "$src" -o "$RUNNER_TEMP/seven-linux"

          cat > "$RUNNER_TEMP/kernel32.def" <<'DEF'
          LIBRARY KERNEL32.dll
          EXPORTS
           GetCommandLineA
           ExitProcess
           GetFileAttributesA
           CreateDirectoryA
          DEF
          cat > "$RUNNER_TEMP/msvcrt.def" <<'DEF'
          LIBRARY msvcrt.dll
          EXPORTS
           malloc
           realloc
           free
           fopen
           fread
           fwrite
           fclose
           fseek
           ftell
           rewind
           strlen
           strcmp
           strncmp
           strstr
           memcpy
           memcmp
           memset
           strcpy
           strncpy
           sprintf
           _snprintf
           puts
           printf
           _strtoi64
          DEF
          lld-link /dll /noentry /def:"$RUNNER_TEMP/kernel32.def" /out:"$RUNNER_TEMP/kernel32-stub.dll" /implib:"$RUNNER_TEMP/kernel32.lib"
          lld-link /dll /noentry /def:"$RUNNER_TEMP/msvcrt.def" /out:"$RUNNER_TEMP/msvcrt-stub.dll" /implib:"$RUNNER_TEMP/msvcrt.lib"
          clang --target=x86_64-pc-windows-msvc -D_WIN32 -std=c11 -O2 -ffreestanding -fno-stack-protector -fno-builtin -mno-stack-arg-probe -c "$src" -o "$RUNNER_TEMP/seven-windows.obj"
          lld-link /subsystem:console /entry:mainCRTStartup /nodefaultlib /out:"$RUNNER_TEMP/seven-windows.exe" "$RUNNER_TEMP/seven-windows.obj" "$RUNNER_TEMP/kernel32.lib" "$RUNNER_TEMP/msvcrt.lib"

      - name: Replace compiler seeds and regenerate archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/old" "$RUNNER_TEMP/new"
          cat seed/native/final/v1/part*.b64 | tr -d '\r\n\t ' | base64 --decode > "$RUNNER_TEMP/old.zip"
          unzip -q "$RUNNER_TEMP/old.zip" -d "$RUNNER_TEMP/old"
          cp "$RUNNER_TEMP/seven-linux" "$RUNNER_TEMP/new/seven-linux"
          cp "$RUNNER_TEMP/seven-windows.exe" "$RUNNER_TEMP/new/seven-windows.exe"
          cp "$RUNNER_TEMP/old/seven-installer-linux" "$RUNNER_TEMP/new/seven-installer-linux"
          cp "$RUNNER_TEMP/old/seven-installer-windows.exe" "$RUNNER_TEMP/new/seven-installer-windows.exe"
          chmod +x "$RUNNER_TEMP/new/seven-linux" "$RUNNER_TEMP/new/seven-installer-linux"
          touch -t 202608060300.00 "$RUNNER_TEMP/new"/*
          (cd "$RUNNER_TEMP/new" && zip -X -q "$RUNNER_TEMP/native-seeds.zip" seven-windows.exe seven-installer-windows.exe seven-linux seven-installer-linux)
          base64 -w0 "$RUNNER_TEMP/native-seeds.zip" > "$RUNNER_TEMP/native-seeds.b64"
          python - <<'PY'
          from pathlib import Path
          source = Path("${{ runner.temp }}/native-seeds.b64").read_text()
          count = 5
          size = ((len(source) + count - 1) // count + 3) // 4 * 4
          root = Path("seed/native/final/v1")
          for i in range(count):
              (root / f"part{i + 1:02}.b64").write_text(source[i * size:(i + 1) * size])
          PY

      - name: Update audited checksums
        shell: bash
        run: |
          set -euo pipefail
          archive_sha=$(sha256sum "$RUNNER_TEMP/native-seeds.zip" | cut -d' ' -f1)
          linux_sha=$(sha256sum "$RUNNER_TEMP/new/seven-linux" | cut -d' ' -f1)
          windows_sha=$(sha256sum "$RUNNER_TEMP/new/seven-windows.exe" | cut -d' ' -f1)
          installer_linux_sha=$(sha256sum "$RUNNER_TEMP/new/seven-installer-linux" | cut -d' ' -f1)
          installer_windows_sha=$(sha256sum "$RUNNER_TEMP/new/seven-installer-windows.exe" | cut -d' ' -f1)
          python - "$archive_sha" "$linux_sha" "$windows_sha" "$installer_linux_sha" "$installer_windows_sha" <<'PY'
          from pathlib import Path
          import re, sys
          archive, linux, windows, installer_linux, installer_windows = sys.argv[1:]
          for name in [".github/workflows/foundation.yml", ".github/workflows/readiness.yml"]:
              path = Path(name)
              text = path.read_text()
              text = re.sub(r"[0-9a-f]{64}(?=  build/native-seeds\.zip)", archive, text)
              text = re.sub(r"[0-9a-f]{64}(?=  build/native-seeds/seven-linux)", linux, text)
              text = re.sub(r"[0-9a-f]{64}(?=  build/native-seeds/seven-windows\.exe)", windows, text)
              path.write_text(text)
          Path("seed/native/final/v1/SHA256SUMS").write_text(
              f"{archive}  native-seeds.zip\n"
              f"{linux}  seven-linux\n"
              f"{windows}  seven-windows.exe\n"
              f"{installer_linux}  seven-installer-linux\n"
              f"{installer_windows}  seven-installer-windows.exe\n"
          )
          PY

      - name: Smoke semantic checker
        shell: bash
        run: |
          set -euo pipefail
          "$RUNNER_TEMP/new/seven-linux" --version
          "$RUNNER_TEMP/new/seven-linux" check examples/hello.sev
          if "$RUNNER_TEMP/new/seven-linux" check conformance/invalid/unknown_name.sev; then
            echo 'semantic checker accepted an invalid program'
            exit 1
          fi

      - name: Commit regenerated seeds
        shell: bash
        run: |
          set -euo pipefail
          git config user.name gabriell211
          git config user.email 102088315+gabriell211@users.noreply.github.com
          git add seed/native/final/v1 .github/workflows/foundation.yml .github/workflows/readiness.yml
          git commit -m 'regenerate semantic native bootstrap seeds'
          git push origin HEAD:gabriell211/production-readiness
