name: Finalize Seven Stage 1 Sources

on:
  push:
    branches:
      - agent/stage1-self-host

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message, '[stage1-canonical]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/stage1-self-host
          fetch-depth: 0

      - name: Consolidate canonical sources and gates
        shell: bash
        run: |
          set -euo pipefail

          python bootstrap/stage1_adapt.py

          python - <<'PY'
          from pathlib import Path

          stage0 = Path('.github/workflows/stage0-fixed-point.yml')
          text = stage0.read_text()
          text = text.replace("          echo 'f2d0e118e3b214fbf9b74571e9529d6cf5318e7a34984aa64ba7a7b6e96a7bb8  build/seven0.monolith.sev' | sha256sum --check\n", "          sha256sum build/seven0.monolith.sev | tee build/seven0-source.sha256\n")
          text = text.replace("          echo 'dad562c0bc695b6e2724425f3fa0b7e6af2929160a27472e256a4cdf24915678  build/seven0.svbc' | sha256sum --check\n          test \"$(wc -c < build/seven0.svbc | tr -d ' ')\" = '83696'\n", "          sha256sum build/seven0.svbc | tee build/seven0-output.sha256\n          wc -c build/seven0.svbc | tee build/seven0-output.size\n")
          text = text.replace("          echo 'ec1cab055cdc99f2293c2009527563afdcd67165dfa98b8a9adf66b4dc7a88bb  build/stage0-proof.svbc' | sha256sum --check\n          test \"$(wc -c < build/stage0-proof.svbc | tr -d ' ')\" = '76'\n", "          sha256sum build/stage0-proof.svbc | tee build/stage0-proof.sha256\n          wc -c build/stage0-proof.svbc | tee build/stage0-proof.size\n")
          text = text.replace("          host_hash=$(sha256sum \"${{ matrix.host }}\" | awk '{print $1}')\n", "          host_hash=$(sha256sum \"${{ matrix.host }}\" | awk '{print $1}')\n          source_hash=$(sha256sum build/seven0.monolith.sev | awk '{print $1}')\n          output_hash=$(sha256sum build/seven0.svbc | awk '{print $1}')\n          proof_hash=$(sha256sum build/stage0-proof.svbc | awk '{print $1}')\n")
          text = text.replace('          entrada_sha256 f2d0e118e3b214fbf9b74571e9529d6cf5318e7a34984aa64ba7a7b6e96a7bb8', '          entrada_sha256 $source_hash')
          text = text.replace('          saida_sha256 dad562c0bc695b6e2724425f3fa0b7e6af2929160a27472e256a4cdf24915678', '          saida_sha256 $output_hash')
          text = text.replace('          prova_sha256 ec1cab055cdc99f2293c2009527563afdcd67165dfa98b8a9adf66b4dc7a88bb', '          prova_sha256 $proof_hash')
          text = text.replace('            build/seven0.monolith.sev\n', '            build/seven0.monolith.sev\n            build/seven0-source.sha256\n            build/seven0-output.sha256\n            build/seven0-output.size\n')
          stage0.write_text(text)

          stage1 = Path('.github/workflows/stage1-compiler-probe.yml')
          text = stage1.read_text()
          text = text.replace("      - name: Apply deterministic Stage 1 adaptations\n        run: python bootstrap/stage1_adapt.py\n\n", "")

          def replace_step(source: str, start: str, end: str, replacement: str) -> str:
              begin = source.index(start)
              finish = source.index(end, begin)
              return source[:begin] + replacement + source[finish:]

          proof = '''      - name: Execute Stage 1 against a fresh package
        shell: bash
        run: |
          set -euo pipefail
          cat > build/stage1-proof.sev <<'EOF'
          modulo stage1.prova

          campo inicio() -> Num ::
            devolve 42
          fecha
          EOF
          printf '%s\\n' 'build/stage1-proof.sev' > build/stage1-proof.sources
          cat > build/stage1-proof.pkg <<'EOF'
          pacote stage1-proof
          versao 0.0.1
          criador Gabriel Barcelos
          entrada stage1.prova.inicio
          alvo svbc
          indice build/stage1-proof.sources
          EOF

          build/genesis-host build/seven.stage1.svbc build/stage1-proof.pkg build/stage1-proof.svbc
          test -s build/stage1-proof.svbc
          test "$(od -An -tx1 -N4 build/stage1-proof.svbc | tr -d ' \\n')" = '53564230'

          set +e
          build/genesis-host build/stage1-proof.svbc
          proof_exit=$?
          set -e
          test "$proof_exit" -eq 42

'''
          text = replace_step(text, '      - name: Execute Stage 1 against a fresh package\n', '      - name: Execute Stage 1 self-rebuild probe\n', proof)

          rebuild = '''      - name: Rebuild Stage 1 deterministically
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\\n' 'build/seven.stage1.monolith.sev' > build/stage2.sources
          cat > build/stage2.pkg <<'EOF'
          pacote seven-stage2
          versao 0.0.1
          criador Gabriel Barcelos
          entrada seven_stage1_monolith.inicio
          alvo svbc
          indice build/stage2.sources
          EOF

          build/genesis-host build/seven.stage1.svbc build/stage2.pkg build/seven.stage2.svbc
          build/genesis-host build/seven.stage1.svbc build/stage2.pkg build/seven.stage2.repeat.svbc
          cmp build/seven.stage2.svbc build/seven.stage2.repeat.svbc
          test "$(od -An -tx1 -N4 build/seven.stage2.svbc | tr -d ' \\n')" = '53564230'

          build/genesis-host build/seven.stage2.svbc build/stage1-proof.pkg build/stage2-proof.svbc
          cmp build/stage1-proof.svbc build/stage2-proof.svbc

          set +e
          build/genesis-host build/stage2-proof.svbc
          proof_exit=$?
          set -e
          test "$proof_exit" -eq 42

'''
          text = replace_step(text, '      - name: Execute Stage 1 self-rebuild probe\n', '      - name: Record Stage 1 and Stage 2 evidence\n', rebuild)

          provenance = '''      - name: Record Stage 1 provenance
        shell: bash
        run: |
          set -euo pipefail
          stage0_hash=$(sha256sum build/seven0.svbc | awk '{print $1}')
          source_hash=$(sha256sum build/seven.stage1.monolith.sev | awk '{print $1}')
          stage1_hash=$(sha256sum build/seven.stage1.svbc | awk '{print $1}')
          stage2_hash=$(sha256sum build/seven.stage2.svbc | awk '{print $1}')
          proof_hash=$(sha256sum build/stage1-proof.svbc | awk '{print $1}')
          cat > build/stage1.provenance <<EOF
          formato seven-bootstrap-provenance-v2
          etapa stage1
          executor build/seven0.svbc
          executor_sha256 $stage0_hash
          entrada build/seven.stage1.monolith.sev
          entrada_sha256 $source_hash
          saida build/seven.stage1.svbc
          saida_sha256 $stage1_hash
          autorebuild build/seven.stage2.svbc
          autorebuild_sha256 $stage2_hash
          prova build/stage1-proof.svbc
          prova_sha256 $proof_hash
          prova_exit 42
          deterministico sim
          EOF
          cat build/stage1.provenance

'''
          text = replace_step(text, '      - name: Record Stage 1 and Stage 2 evidence\n', '      - uses: actions/upload-artifact@v4\n', provenance)
          text = text.replace('            build/seven.stage2.repeat.svbc\n', '            build/seven.stage2.repeat.svbc\n            build/stage2-proof.svbc\n            build/stage1.provenance\n')
          stage1.write_text(text)
          PY

          rm -f bootstrap/stage1_adapt.py
          rm -f bootstrap/stage1.status
          rm -f .github/workflows/stage1-source-snapshot.yml
          rm -f .github/workflows/stage1-patch-variants.yml

      - name: Commit canonical Stage 1 implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name seven-bootstrap-bot
          git config user.email actions@users.noreply.github.com
          git add -A
          git commit -m '[stage1-canonical] Consolidate Stage 1 self-hosting sources'
          git push origin HEAD:agent/stage1-self-host
