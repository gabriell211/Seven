name: Seven Native TCP

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seven-native-tcp-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Stage1 emits TCP ELF64 and PE32+
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct audited Seven bootstrap
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          cat bootstrap/seed/v2/part*.b64 | tr -d '\r\n\t ' | base64 --decode | gzip --decompress > build/seven0.seed.svbc
          echo '123f5b513bcae7774671898f471441b3c71efd570acad91fa634cbc5f33bb223  build/seven0.seed.svbc' | sha256sum --check
          (cd bootstrap/host/v2 && sha256sum --check SHA256SUMS)
          gcc -O2 -std=c11 -Wall -Wextra -Werror bootstrap/host/v2/genesis-host.c -o build/genesis-host

      - name: Rebuild Seven-0 fixed point
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'modulo seven0_bootstrap_monolith\n\n'
            for arquivo in $(find compiler0 -maxdepth 1 -type f -name '*.sev' | LC_ALL=C sort); do
              printf '// BEGIN %s\n' "$(basename "$arquivo")"
              sed '/^modulo /d; /^usa /d' "$arquivo"
              printf '// END %s\n\n' "$(basename "$arquivo")"
            done
          } > build/seven0.monolith.sev
          build/genesis-host build/seven0.seed.svbc build/seven0.monolith.sev build/seven0.svbc
          build/genesis-host build/seven0.svbc build/seven0.monolith.sev build/seven0.self.svbc
          cmp build/seven0.svbc build/seven0.self.svbc

      - name: Build Stage1 compiler
        shell: bash
        run: |
          set -euo pipefail
          cat > build/stage1.sources <<'EOF'
          std/base/lista.sev
          std/base/resultado.sev
          std/base/talvez.sev
          std/base/mapa.sev
          std/base/texto.sev
          std/mem/bytes.sev
          std/fs/file.sev
          compiler/ast.sev
          compiler/bytecode.sev
          compiler/diagnostic.sev
          compiler/driver.sev
          compiler/effects.sev
          compiler/emitter.sev
          compiler/ffi.sev
          compiler/ir.sev
          compiler/lexer.sev
          compiler/memory.sev
          compiler/package.sev
          compiler/parser_part00.sev
          compiler/parser_part01.sev
          compiler/parser_part02.sev
          compiler/parser_part03.sev
          compiler/parser_part04.sev
          compiler/parser_part05.sev
          compiler/parser_cursor.sev
          compiler/semantic.sev
          compiler/source.sev
          compiler/symbols.sev
          compiler/token.sev
          compiler/types_part00.sev
          compiler/types_part01.sev
          compiler/types_part02.sev
          compiler/types_part03.sev
          EOF

          {
            printf 'modulo seven_stage1_monolith\n\n'
            while IFS= read -r arquivo; do
              printf '// BEGIN %s\n' "$arquivo"
              case "$arquivo" in
                compiler/bytecode.sev)
                  sed '/^modulo /d; /^usa /d; s/emite_constante(/bytecode_emite_constante(/g' "$arquivo"
                  ;;
                compiler/emitter.sev)
                  sed '/^modulo /d; /^usa /d; s/^campo emite(/campo emite_formato(/' "$arquivo"
                  ;;
                *)
                  sed '/^modulo /d; /^usa /d' "$arquivo"
                  ;;
              esac
              printf '// END %s\n\n' "$arquivo"
            done < build/stage1.sources
            cat <<'EOF'
          campo inicio(argumentos: Lista<Texto>) -> Num toca terminal, disco, ambiente ::
            guarda pedido := pedido_de_compilacao(argumentos)
            guarda saida := compila(pedido)
            veja saida e Sucesso ::
              devolve 0
            outro ::
              mostra_diagnosticos(saida.diagnosticos)
              devolve 1
            fecha
          fecha
          EOF
          } > build/seven.stage1.monolith.sev

          build/genesis-host build/seven0.svbc build/seven.stage1.monolith.sev build/seven.stage1.svbc
          test "$(od -An -tx1 -N4 build/seven.stage1.svbc | tr -d ' \n')" = '53564230'

      - name: Compile TCP application with Stage1
        shell: bash
        run: |
          set -euo pipefail
          cat > build/native-tcp-app.sources <<'EOF'
          std/base/lista.sev
          std/base/resultado.sev
          std/base/talvez.sev
          std/base/mapa.sev
          std/base/texto.sev
          std/mem/bytes.sev
          std/net/tcp.sev
          tests/native/tcp_app.sev
          EOF
          cat > build/native-tcp-app.pkg <<'EOF'
          pacote native-tcp-app
          versao 0.0.1
          criador Gabriel Barcelos
          entrada tests.native.tcp_app.inicio
          alvo svbc
          indice build/native-tcp-app.sources
          EOF
          build/genesis-host build/seven.stage1.svbc build/native-tcp-app.pkg build/native-tcp-app.svbc
          test -s build/native-tcp-app.svbc
          test "$(od -An -tx1 -N4 build/native-tcp-app.svbc | tr -d ' \n')" = '53564243'

      - name: Compile TCP native lowering driver with Stage1
        shell: bash
        run: |
          set -euo pipefail
          cp runtime/platform/native/runtime.sources build/native-tcp-backend.sources
          echo 'runtime/svbc/decoder.sev' >> build/native-tcp-backend.sources
          echo 'tests/native/tcp_backend.sev' >> build/native-tcp-backend.sources
          cat > build/native-tcp-backend.pkg <<'EOF'
          pacote native-tcp-backend
          versao 0.0.1
          criador Gabriel Barcelos
          entrada tests.native.tcp_backend.inicio
          alvo svbc
          indice build/native-tcp-backend.sources
          EOF
          build/genesis-host build/seven.stage1.svbc build/native-tcp-backend.pkg build/native-tcp-backend.svbc
          test -s build/native-tcp-backend.svbc

      - name: Lower TCP application to native targets
        shell: bash
        run: |
          set -euo pipefail
          build/genesis-host build/native-tcp-backend.svbc
          test "$(od -An -tx1 -N4 build/native-tcp-proof | tr -d ' \n')" = '7f454c46'
          test "$(od -An -tx1 -N2 build/native-tcp-proof.exe | tr -d ' \n')" = '4d5a'

      - name: Inspect Windows TCP imports
        shell: bash
        run: |
          set -euo pipefail
          objdump -p build/native-tcp-proof.exe | tee build/native-tcp-proof.pe.txt
          grep -q 'KERNEL32.dll' build/native-tcp-proof.pe.txt
          grep -q 'WS2_32.dll' build/native-tcp-proof.pe.txt
          for symbol in WSAStartup socket bind listen accept recv send closesocket setsockopt; do
            grep -q "$symbol" build/native-tcp-proof.pe.txt
          done

      - name: Execute native TCP roundtrip on Linux
        shell: bash
        run: |
          set -euo pipefail
          chmod +x build/native-tcp-proof
          python3 - <<'PY'
          import socket
          import subprocess
          import time

          proc = subprocess.Popen(["./build/native-tcp-proof"])
          sock = None
          last = None
          for _ in range(100):
              if proc.poll() is not None:
                  raise SystemExit(f"server exited early with {proc.returncode}")
              try:
                  sock = socket.create_connection(("127.0.0.1", 18777), timeout=0.25)
                  break
              except OSError as exc:
                  last = exc
                  time.sleep(0.05)
          if sock is None:
              proc.kill()
              raise SystemExit(f"could not connect: {last}")

          with sock:
              sock.sendall(b"ping")
              data = sock.recv(4)
          rc = proc.wait(timeout=5)
          print(f"native TCP server exit code: {rc}; response={data!r}")
          if rc != 42:
              raise SystemExit(f"unexpected server exit code: {rc}; response={data!r}")
          if data != b"pong":
              raise SystemExit(f"unexpected TCP response: {data!r}")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: seven-native-tcp-proof
          path: |
            build/native-tcp-proof
            build/native-tcp-proof.exe
            build/native-tcp-app.svbc
            build/native-tcp-backend.svbc
            build/native-tcp-proof.pe.txt
          if-no-files-found: error

  windows:
    name: Execute TCP PE32+ roundtrip
    needs: generate
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: seven-native-tcp-proof
          path: build

      - name: Execute native TCP roundtrip on Windows
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import socket
          import subprocess
          import time

          proc = subprocess.Popen([r"build\native-tcp-proof.exe"])
          sock = None
          last = None
          for _ in range(100):
              if proc.poll() is not None:
                  raise SystemExit(f"server exited early with {proc.returncode}")
              try:
                  sock = socket.create_connection(("127.0.0.1", 18777), timeout=0.25)
                  break
              except OSError as exc:
                  last = exc
                  time.sleep(0.05)
          if sock is None:
              proc.kill()
              raise SystemExit(f"could not connect: {last}")

          with sock:
              sock.sendall(b"ping")
              data = sock.recv(4)
          rc = proc.wait(timeout=5)
          if data != b"pong":
              raise SystemExit(f"unexpected TCP response: {data!r}")
          if rc != 42:
              raise SystemExit(f"unexpected server exit code: {rc}")
          PY
