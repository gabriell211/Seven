name: Repair Production Readiness

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/repair-production-readiness.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gabriell211/production-readiness
          fetch-depth: 0

      - name: Fix IR mutability contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("compiler/ir.sev")
          text = path.read_text()
          old = '''  veja comando e CmdCria ::
    guarda valor := baixa_expressao(comando.valor.valor, contexto)
    guarda tipo := TipoDesconhecido
'''
          new = '''  veja comando e CmdCria ::
    guarda valor := baixa_expressao(comando.valor.valor, contexto)
    solta tipo := TipoDesconhecido
'''
          if old not in text:
              raise SystemExit("IR mutability target not found")
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Commit repair to readiness branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name gabriell211
          git config user.email 102088315+gabriell211@users.noreply.github.com
          git add compiler/ir.sev
          git diff --cached --check
          git commit -m 'fix IR type mutability during lowering'
          git push origin HEAD:gabriell211/production-readiness

# trigger: ir-mutability
