name: Apply Stage 2 Fixed Point

on:
  push:
    branches:
      - stage1-fixed-point-final

permissions:
  contents: write

jobs:
  apply:
    if: ${{ hashFiles('.github/fixed-point/READY') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply the validated fixed-point patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/fixed-point/chunk*.b64 | tr -d '\r\n' | base64 --decode > /tmp/fixed-point.patch
          echo '4095525ee374977a38ef1640bfdaf148ed345d0f09900c126b6414348b5f6a1a  /tmp/fixed-point.patch' | sha256sum --check
          git apply --check /tmp/fixed-point.patch
          git apply /tmp/fixed-point.patch
          rm -rf .github/fixed-point .github/workflows/apply-stage2-fixed-point.yml
          git config user.name 'gabriell211'
          git config user.email '102088315+gabriell211@users.noreply.github.com'
          git add -A
          git commit -m 'Complete the Seven Stage 2 fixed point'
          git push origin HEAD:stage1-fixed-point-final
