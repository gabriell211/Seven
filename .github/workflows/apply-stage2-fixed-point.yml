name: Apply Stage 2 Fixed Point

on:
  push:
    branches:
      - stage1-fixed-point-final

permissions:
  contents: write

jobs:
  apply:
    if: ${{ hashFiles('.github/fixed-point/READY') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply the validated fixed-point patch
        shell: bash
        run: |
          set -euo pipefail
          cat .github/fixed-point/gz*.txt | base64 --decode > /tmp/fixed-point.patch.gz
          echo 'a58a19608513dbdb94f8219008f7e652f8c6482949de79bac5e2593c8420e538  /tmp/fixed-point.patch.gz' | sha256sum --check
          gzip --decompress --stdout /tmp/fixed-point.patch.gz > /tmp/fixed-point.patch
          echo '60e34fc09e128a4a50e5640165f0624ebd9c9b9edb51e839455e059424c9c251  /tmp/fixed-point.patch' | sha256sum --check
          git apply --check /tmp/fixed-point.patch
          git apply /tmp/fixed-point.patch
          rm -rf .github/fixed-point .github/workflows/apply-stage2-fixed-point.yml
          git config user.name 'gabriell211'
          git config user.email '102088315+gabriell211@users.noreply.github.com'
          git add -A
          git commit -m 'Complete the Seven Stage 2 fixed point'
          git push origin HEAD:stage1-fixed-point-final
