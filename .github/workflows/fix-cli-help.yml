name: Fix Seven CLI Help Syntax

on:
  push:
    branches:
      - gabriell211/production-readiness
    paths:
      - .github/workflows/fix-cli-help.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gabriell211/production-readiness
          fetch-depth: 0
      - run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('compiler/toolchain/cli.sev')
          text = path.read_text()
          broken = '" +\\n    "seven preview'
          fixed = '" +\n    "seven preview'
          if broken not in text:
              raise SystemExit('broken CLI help escape not found')
          path.write_text(text.replace(broken, fixed))
          PY
          git config user.name gabriell211
          git config user.email 102088315+gabriell211@users.noreply.github.com
          git add compiler/toolchain/cli.sev
          git commit -m 'fix Seven CLI help source syntax'
          git push origin HEAD:gabriell211/production-readiness
