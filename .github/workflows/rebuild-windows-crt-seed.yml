name: Rebuild Seven Windows CRT Seed

on:
  pull_request:
    paths:
      - .github/workflows/rebuild-windows-crt-seed.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seven-windows-crt-seed
  cancel-in-progress: true

jobs:
  rebuild:
    name: Rebuild Windows transition seed with standard CRT
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/seven-web-build
          fetch-depth: 0

      - name: Install Windows cross compiler
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Materialize audited seed builder
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/scripts
          git show d786cf8b432e72283163a5dc43bfc8d5f4d7105b:.github/scripts/rebuild-web-seeds.sh > .github/scripts/rebuild-web-seeds.sh
          git show d786cf8b432e72283163a5dc43bfc8d5f4d7105b:.github/scripts/run-rebuild-web-seeds.sh > .github/scripts/run-rebuild-web-seeds.sh
          chmod +x .github/scripts/rebuild-web-seeds.sh .github/scripts/run-rebuild-web-seeds.sh

      - name: Prepare generated rebuild procedure
        shell: bash
        run: |
          set -euo pipefail
          cp .github/scripts/rebuild-web-seeds.sh "$RUNNER_TEMP/prepare-web-seeds.sh"
          PREPARE="$RUNNER_TEMP/prepare-web-seeds.sh" python - <<'PY'
          import os
          from pathlib import Path

          path = Path(os.environ['PREPARE'])
          text = path.read_text()
          final = 'bash .github/scripts/rebuild-semantic-seeds.sh\n'
          if not text.endswith(final):
              raise SystemExit('seed builder final execution target not found')
          path.write_text(text[:-len(final)])
          PY
          bash "$RUNNER_TEMP/prepare-web-seeds.sh"

      - name: Use standard Windows CRT and main
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT=.github/scripts/rebuild-semantic-seeds.sh python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path(os.environ['SCRIPT'])
          text = path.read_text()
          linux_marker = 'gcc -std=c11 -O2 -s -Wall -Wextra -Wno-unused-parameter "$work/seven-bootstrap.c" -o "$work/seven-linux"\n'
          if linux_marker not in text:
              raise SystemExit('Linux compiler marker not found')

          crt_patch = r"""CHECKER_SOURCE="$work/seven-bootstrap.c" python - <<'PYCRT'
          import os
          import re
          from pathlib import Path

          path = Path(os.environ['CHECKER_SOURCE'])
          source = path.read_text()
          windows_headers = '''#ifdef _WIN32
          #include <stdio.h>
          #include <stdlib.h>
          #include <stdint.h>
          #include <stddef.h>
          #include <string.h>
          #include <ctype.h>
          #include <windows.h>
          #define strtoll _strtoi64
          #define snprintf _snprintf
          #else'''
          source, header_count = re.subn(
              r'#ifdef _WIN32\n(?:(?!#else).)*GetFileAttributesA(?:(?!#else).)*#else',
              windows_headers,
              source,
              count=1,
              flags=re.S,
          )
          if header_count != 1:
              raise SystemExit(f'Windows header replacements: {header_count}')

          source, entry_count = re.subn(
              r'#ifndef _WIN32\nint main\(int argc,char\*\*argv\)\{return core_main\(argc,argv\);\}\n#else\n.*?\n#endif',
              'int main(int argc,char**argv){return core_main(argc,argv);}',
              source,
              count=1,
              flags=re.S,
          )
          if entry_count != 1:
              raise SystemExit(f'Windows entrypoint replacements: {entry_count}')
          path.write_text(source)
          PYCRT
          """
          text = text.replace(linux_marker, crt_patch + linux_marker, 1)

          windows_block = re.compile(
              r'cat > "\$work/kernel32\.def".*?"\$link"[^\n]*seven-windows\.exe[^\n]*\n',
              re.S,
          )
          windows_compile = (
              'x86_64-w64-mingw32-gcc -std=c11 -O2 -s -Wall -Wextra '
              '-Wno-unused-parameter -static -static-libgcc '
              '-Wl,--stack,16777216 "$work/seven-bootstrap.c" '
              '-o "$work/seven-windows.exe"\n'
          )
          text, compile_count = windows_block.subn(windows_compile, text, count=1)
          if compile_count != 1:
              raise SystemExit(f'Windows compiler block replacements: {compile_count}')
          path.write_text(text)
          PY

      - name: Rebuild and publish audited seeds
        shell: bash
        run: bash .github/scripts/rebuild-semantic-seeds.sh
