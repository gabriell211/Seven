name: Regenerate Semantic Native Seeds v3

on:
  push:
    branches:
      - gabriell211/production-readiness
    paths:
      - .github/workflows/regenerate-semantic-seeds-v3.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gabriell211/production-readiness
          fetch-depth: 0

      - name: Regenerate with committed diagnostics
        shell: bash
        run: |
          set +e
          log=seed/native/final/v1/GENERATOR_LOG.txt
          : > "$log"
          exec > >(tee -a "$log") 2>&1
          status=0

          echo '== tools =='
          command -v gcc || status=1
          command -v clang || status=1
          link=$(command -v lld-link || command -v lld-link-18 || command -v lld-link-17 || true)
          echo "linker=$link"
          test -n "$link" || status=1

          echo '== source =='
          awk '/seven-bootstrap.c.gz.b64.*B64/{capture=1;next} /^          B64$/{capture=0} capture{sub(/^          /,"");print}' .github/workflows/regenerate-semantic-seeds.yml > "$RUNNER_TEMP/seven-bootstrap.c.gz.b64"
          wc -c "$RUNNER_TEMP/seven-bootstrap.c.gz.b64"
          base64 --decode "$RUNNER_TEMP/seven-bootstrap.c.gz.b64" | gzip --decompress > "$RUNNER_TEMP/seven-bootstrap.c"
          test -s "$RUNNER_TEMP/seven-bootstrap.c" || status=1
          wc -c "$RUNNER_TEMP/seven-bootstrap.c"

          if [ "$status" -eq 0 ]; then
            echo '== linux =='
            gcc -std=c11 -O2 -s -Wall -Wextra -Wno-unused-parameter "$RUNNER_TEMP/seven-bootstrap.c" -o "$RUNNER_TEMP/seven-linux" || status=$?
          fi

          if [ "$status" -eq 0 ]; then
            echo '== windows =='
            cat > "$RUNNER_TEMP/kernel32.def" <<'DEF'
          LIBRARY KERNEL32.dll
          EXPORTS
           GetCommandLineA
           ExitProcess
           GetFileAttributesA
           CreateDirectoryA
          DEF
            cat > "$RUNNER_TEMP/msvcrt.def" <<'DEF'
          LIBRARY msvcrt.dll
          EXPORTS
           malloc
           realloc
           free
           fopen
           fread
           fwrite
           fclose
           fseek
           ftell
           rewind
           strlen
           strcmp
           strncmp
           strstr
           memcpy
           memcmp
           memset
           strcpy
           strncpy
           sprintf
           _snprintf
           puts
           printf
           _strtoi64
          DEF
            "$link" /dll /noentry /def:"$RUNNER_TEMP/kernel32.def" /out:"$RUNNER_TEMP/kernel32-stub.dll" /implib:"$RUNNER_TEMP/kernel32.lib" || status=$?
            "$link" /dll /noentry /def:"$RUNNER_TEMP/msvcrt.def" /out:"$RUNNER_TEMP/msvcrt-stub.dll" /implib:"$RUNNER_TEMP/msvcrt.lib" || status=$?
            clang --target=x86_64-pc-windows-msvc -D_WIN32 -std=c11 -O2 -ffreestanding -fno-stack-protector -fno-builtin -mno-stack-arg-probe -c "$RUNNER_TEMP/seven-bootstrap.c" -o "$RUNNER_TEMP/seven-windows.obj" || status=$?
            "$link" /subsystem:console /entry:mainCRTStartup /nodefaultlib /out:"$RUNNER_TEMP/seven-windows.exe" "$RUNNER_TEMP/seven-windows.obj" "$RUNNER_TEMP/kernel32.lib" "$RUNNER_TEMP/msvcrt.lib" || status=$?
          fi

          if [ "$status" -eq 0 ]; then
            echo '== archive =='
            mkdir -p "$RUNNER_TEMP/old" "$RUNNER_TEMP/new"
            cat seed/native/final/v1/part*.b64 | tr -d '\r\n\t ' | base64 --decode > "$RUNNER_TEMP/old.zip" || status=$?
            unzip -q "$RUNNER_TEMP/old.zip" -d "$RUNNER_TEMP/old" || status=$?
            cp "$RUNNER_TEMP/seven-linux" "$RUNNER_TEMP/new/seven-linux"
            cp "$RUNNER_TEMP/seven-windows.exe" "$RUNNER_TEMP/new/seven-windows.exe"
            cp "$RUNNER_TEMP/old/seven-installer-linux" "$RUNNER_TEMP/new/seven-installer-linux"
            cp "$RUNNER_TEMP/old/seven-installer-windows.exe" "$RUNNER_TEMP/new/seven-installer-windows.exe"
            chmod +x "$RUNNER_TEMP/new/seven-linux" "$RUNNER_TEMP/new/seven-installer-linux"
            touch -t 202608060300.00 "$RUNNER_TEMP/new"/*
            (cd "$RUNNER_TEMP/new" && zip -X -q "$RUNNER_TEMP/native-seeds.zip" seven-windows.exe seven-installer-windows.exe seven-linux seven-installer-linux) || status=$?
          fi

          if [ "$status" -eq 0 ]; then
            echo '== smoke =='
            "$RUNNER_TEMP/new/seven-linux" --version || status=$?
            "$RUNNER_TEMP/new/seven-linux" check examples/hello.sev || status=$?
            if "$RUNNER_TEMP/new/seven-linux" check conformance/invalid/unknown_name.sev; then
              echo 'invalid source accepted'
              status=1
            fi
          fi

          if [ "$status" -eq 0 ]; then
            echo '== write =='
            base64 -w0 "$RUNNER_TEMP/native-seeds.zip" > "$RUNNER_TEMP/native-seeds.b64"
            python - <<'PY'
          from pathlib import Path
          source = Path("${{ runner.temp }}/native-seeds.b64").read_text()
          count = 5
          size = ((len(source) + count - 1) // count + 3) // 4 * 4
          root = Path("seed/native/final/v1")
          for i in range(count):
              (root / f"part{i + 1:02}.b64").write_text(source[i * size:(i + 1) * size])
          PY
            archive_sha=$(sha256sum "$RUNNER_TEMP/native-seeds.zip" | cut -d' ' -f1)
            linux_sha=$(sha256sum "$RUNNER_TEMP/new/seven-linux" | cut -d' ' -f1)
            windows_sha=$(sha256sum "$RUNNER_TEMP/new/seven-windows.exe" | cut -d' ' -f1)
            installer_linux_sha=$(sha256sum "$RUNNER_TEMP/new/seven-installer-linux" | cut -d' ' -f1)
            installer_windows_sha=$(sha256sum "$RUNNER_TEMP/new/seven-installer-windows.exe" | cut -d' ' -f1)
            python - "$archive_sha" "$linux_sha" "$windows_sha" "$installer_linux_sha" "$installer_windows_sha" <<'PY'
          from pathlib import Path
          import re, sys
          archive, linux, windows, il, iw = sys.argv[1:]
          for name in [".github/workflows/foundation.yml", ".github/workflows/readiness.yml"]:
              path = Path(name)
              text = path.read_text()
              text = re.sub(r"[0-9a-f]{64}(?=  build/native-seeds\.zip)", archive, text)
              text = re.sub(r"[0-9a-f]{64}(?=  build/native-seeds/seven-linux)", linux, text)
              text = re.sub(r"[0-9a-f]{64}(?=  build/native-seeds/seven-windows\.exe)", windows, text)
              path.write_text(text)
          Path("seed/native/final/v1/SHA256SUMS").write_text(f"{archive}  native-seeds.zip\n{linux}  seven-linux\n{windows}  seven-windows.exe\n{il}  seven-installer-linux\n{iw}  seven-installer-windows.exe\n")
          PY
          fi

          echo "status=$status"
          git config user.name gabriell211
          git config user.email 102088315+gabriell211@users.noreply.github.com
          git add seed/native/final/v1 .github/workflows/foundation.yml .github/workflows/readiness.yml
          git commit -m "semantic seed regeneration result status $status" || true
          git push origin HEAD:gabriell211/production-readiness
          exit "$status"
