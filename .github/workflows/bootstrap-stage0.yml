name: Seven Genesis Stage 0

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seven-genesis-stage0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  stage0:
    name: Genesis Stage 0 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            seed: seven-linux
          - os: windows-latest
            seed: seven-windows.exe

    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct audited transition executables
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/native-seeds
          cat seed/native/final/v1/part*.b64 | tr -d '\r\n\t ' | base64 --decode > build/native-seeds.zip
          echo '670646ab39df2f2a111c664e16023af3ddc3b203982945609193da99d8c4bac7  build/native-seeds.zip' | sha256sum --check
          unzip -q build/native-seeds.zip -d build/native-seeds
          chmod +x "build/native-seeds/${{ matrix.seed }}" || true

      - name: Produce the one-time Seven-0 seed candidate
        shell: bash
        run: |
          set -euo pipefail
          seven="$PWD/build/native-seeds/${{ matrix.seed }}"
          "$seven" check compiler0/seven0.sev
          "$seven" build compiler0/seven0.sev build/seven0.candidate.svbc
          test -s build/seven0.candidate.svbc
          sha256sum build/seven0.candidate.svbc > build/seven0.candidate.sha256

      - name: Attempt the autonomous Genesis Stage 0
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          seven="$PWD/build/native-seeds/${{ matrix.seed }}"
          "$seven" run bootstrap/stage0.sev

      - name: Inspect generated Stage 0 files
        if: always()
        shell: bash
        run: |
          set -u
          ls -la build || true
          echo 'candidate size:'
          wc -c build/seven0.candidate.svbc
          echo 'candidate first 32 bytes:'
          od -An -tx1 -N32 build/seven0.candidate.svbc
          echo 'candidate sha256:'
          cat build/seven0.candidate.sha256
          if test -f build/seven0.svbc; then
            echo 'autonomous seven0 size:'
            wc -c build/seven0.svbc
            echo 'autonomous seven0 first 32 bytes:'
            od -An -tx1 -N32 build/seven0.svbc
            echo 'autonomous seven0 sha256:'
            sha256sum build/seven0.svbc
          else
            echo 'autonomous seven0 ausente'
          fi
          if test -f build/stage0.provenance; then
            echo 'stage0 provenance:'
            cat build/stage0.provenance
          else
            echo 'stage0 provenance ausente'
          fi

      - name: Upload seed candidate and Stage 0 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seven-stage0-${{ matrix.os }}
          path: |
            build/seven0.candidate.svbc
            build/seven0.candidate.sha256
            build/seven0.svbc
            build/stage0.provenance
          if-no-files-found: error

      - name: Enforce autonomous Stage 0 gate
        shell: bash
        run: |
          set -euxo pipefail
          test -s build/seven0.candidate.svbc
          test -s build/seven0.svbc
          cmp build/seven0.candidate.svbc build/seven0.svbc
          test -s build/stage0.provenance
          grep -Fx 'formato seven-bootstrap-provenance-v1' build/stage0.provenance
          grep -Fx 'etapa stage0' build/stage0.provenance
          grep -Fx 'executor seed/genesis.svhex' build/stage0.provenance
          grep -Fx 'entrada compiler0/seven0.sev' build/stage0.provenance
          grep -Fx 'saida build/seven0.svbc' build/stage0.provenance
