name: Seven Genesis Bootstrap Audit

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seven-genesis-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Current bootstrap audit (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build current self-hosted Seven
        uses: ./.github/actions/self-hosted-seven

      - name: Verify current bootstrap boundary
        shell: bash
        run: |
          set -euo pipefail
          cmp build/seven0.svbc build/seven0.self.svbc
          cmp build/seven.stage2.svbc build/seven.stage2.self.svbc
          grep -q '^transition_seed nao$' build/current-seven/PROVENANCE
          test "$(od -An -tx1 -N4 build/seven0.svbc | tr -d ' \n')" = '53564230'
          test "$(od -An -tx1 -N4 build/seven.stage2.svbc | tr -d ' \n')" = '53564243'

      - name: Record current bootstrap audit
        shell: bash
        run: |
          set -euo pipefail
          stage0_hash=$(sha256sum build/seven0.svbc | awk '{print $1}')
          stage2_hash=$(sha256sum build/seven.stage2.svbc | awk '{print $1}')
          cat > build/genesis-audit.txt <<EOF
          formato seven-genesis-audit-v2
          status self-hosted
          bootstrap bootstrap/seed/v2
          stage0_sha256 $stage0_hash
          stage2_sha256 $stage2_hash
          stage0_fixed_point sim
          stage2_fixed_point sim
          transition_seed nao
          EOF
          cat build/genesis-audit.txt

      - uses: actions/upload-artifact@v4
        with:
          name: seven-genesis-audit-${{ matrix.os }}
          path: |
            build/seven0.svbc
            build/seven0.self.svbc
            build/seven.stage2.svbc
            build/seven.stage2.self.svbc
            build/current-seven/PROVENANCE
            build/genesis-audit.txt
          if-no-files-found: error
