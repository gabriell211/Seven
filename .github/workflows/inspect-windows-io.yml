name: Inspect Windows Bootstrap IO

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Recover and inspect native file IO
        shell: bash
        run: |
          set -euo pipefail
          git show 3e84aa820625d13370b833b59a869d4e99d81dae:.github/workflows/regenerate-semantic-seeds.yml > "$RUNNER_TEMP/generator.yml"
          awk '/seven-bootstrap.c.gz.b64.*B64/{capture=1;next} /^          B64$/{capture=0} capture{sub(/^          /,"");print}' "$RUNNER_TEMP/generator.yml" > "$RUNNER_TEMP/seven-bootstrap.c.gz.b64"
          base64 --decode "$RUNNER_TEMP/seven-bootstrap.c.gz.b64" | gzip --decompress > "$RUNNER_TEMP/seven-bootstrap.c"
          grep -n -C 14 -E 'read_file|write_file|fopen|CreateDirectoryA' "$RUNNER_TEMP/seven-bootstrap.c" | head -n 220

