name: Verify Readiness Branch Write

on:
  push:
    branches:
      - gabriell211/production-readiness
    paths:
      - .github/workflows/branch-write-test.yml

permissions:
  contents: write

jobs:
  write:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gabriell211/production-readiness
      - run: |
          set -euo pipefail
          printf 'branch write verified\n' > seed/native/final/v1/GENERATOR_READY
          git config user.name gabriell211
          git config user.email 102088315+gabriell211@users.noreply.github.com
          git add seed/native/final/v1/GENERATOR_READY
          git commit -m 'verify readiness branch write'
          git push origin HEAD:gabriell211/production-readiness
