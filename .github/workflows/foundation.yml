name: Seven Native Foundation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seven-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows compiler and installer
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject retired PowerShell bridge
        shell: cmd
        run: |
          for /r %%F in (*.ps1 *.psm1) do (
            echo forbidden bridge file: %%F
            exit /b 1
          )

      - name: Verify bootstrap compiler
        shell: cmd
        run: bin\seven.exe --version

      - name: Check Seven sources
        shell: cmd
        run: |
          bin\seven.exe check compiler0\seven0.sev
          bin\seven.exe check compiler\seven.sev
          bin\seven.exe check runtime\host\seven.sev
          bin\seven.exe check runtime\launcher\seven.sev
          bin\seven.exe check runtime\installer\seven.sev
          bin\seven.exe check compiler\toolchain\installer.sev
          bin\seven.exe check compiler\toolchain\installer_builder.sev
          bin\seven.exe check compiler\toolchain\production_audit.sev

      - name: Materialize deterministic Seven images
        shell: cmd
        run: |
          if not exist build mkdir build
          bin\seven.exe build compiler0\seven0.sev build\seven0.svbc
          bin\seven.exe build compiler\seven.sev build\seven.svbc
          bin\seven.exe build compiler\seven.sev build\seven.self.svbc
          bin\seven.exe build runtime\host\seven.sev build\seven.host.svbc
          bin\seven.exe build runtime\launcher\seven.sev build\seven.launcher.svbc
          bin\seven.exe build runtime\installer\seven.sev build\seven.installer.svbc
          fc /b build\seven.svbc build\seven.self.svbc

      - name: Reconstruct and verify native seeds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/native-seeds
          : > build/native-seeds.zip
          for part in seed/native/archive/native-seeds.b64.*; do
            tr -cd 'A-Za-z0-9+/=' < "$part" | base64 --decode >> build/native-seeds.zip
          done
          echo '207b4d92a4bfd4d8dc32cba05c5d6b24cc6f7b62e87210de81eb3addc85f50a4  build/native-seeds.zip' | sha256sum --check
          unzip -q build/native-seeds.zip -d build/native-seeds
          cd build/native-seeds
          echo '6c65dee95cbb3fe2b99a05bbe65a18dd11b3621b59f5f6bb431a5584a062ef86  seven-windows.exe' | sha256sum --check
          echo '2192b7576e485a4bbd0a267cb18a836652c2b2de8953937a81992cbc52d6ad0f  seven-installer-windows.exe' | sha256sum --check
          echo 'f91edfecd7620922109609d89be16426f6f1535e02b03631b4bcd5c174e5405f  seven-linux' | sha256sum --check
          echo '8d5b9c534018d8b8ccca7fcdfaa6f7d40587c8a039d63ae214c62f93d35d533e  seven-installer-linux' | sha256sum --check

      - name: Verify native Windows compiler
        shell: cmd
        run: |
          build\native-seeds\seven-windows.exe --version
          build\native-seeds\seven-windows.exe check examples\hello.sev
          build\native-seeds\seven-windows.exe build examples\hello.sev build\native-hello.svbc
          build\native-seeds\seven-windows.exe verify foundation
          build\native-seeds\seven-windows.exe verify bootstrap
          build\native-seeds\seven-windows.exe doctor

      - name: Assemble Windows installer bundle
        shell: cmd
        run: |
          set "BUNDLE=build\installers\seven-0.1.0-windows-x64"
          mkdir "%BUNDLE%\payload\bin"
          mkdir "%BUNDLE%\payload\std"
          copy /y build\native-seeds\seven-installer-windows.exe "%BUNDLE%\seven-installer.exe"
          copy /y build\native-seeds\seven-windows.exe "%BUNDLE%\payload\bin\seven.exe"
          copy /y build\seven.svbc "%BUNDLE%\payload\seven.svbc"
          copy /y build\seven.host.svbc "%BUNDLE%\payload\seven.host.svbc"
          copy /y build\seven.launcher.svbc "%BUNDLE%\payload\seven.launcher.svbc"
          copy /y brand\seven.ico "%BUNDLE%\payload\seven.ico"
          copy /y brand\seven-mark.svg "%BUNDLE%\payload\seven-mark.svg"
          copy /y LICENSE "%BUNDLE%\payload\LICENSE"
          copy /y NOTICE "%BUNDLE%\payload\NOTICE"
          xcopy std "%BUNDLE%\payload\std" /E /I /Y >nul
          certutil -hashfile "%BUNDLE%\seven-installer.exe" SHA256 > "%BUNDLE%\seven-installer.exe.sha256"

      - name: Test Windows installation and removal
        shell: cmd
        run: |
          set "BUNDLE=%CD%\build\installers\seven-0.1.0-windows-x64"
          set "LOCALAPPDATA=%CD%\build\windows-home\LocalAppData"
          set "APPDATA=%CD%\build\windows-home\AppData"
          mkdir "%LOCALAPPDATA%"
          mkdir "%APPDATA%"
          start /wait "" "%BUNDLE%\seven-installer.exe"
          if errorlevel 1 exit /b 1
          if not exist "%LOCALAPPDATA%\Programs\Seven\bin\seven.exe" exit /b 1
          if not exist "%LOCALAPPDATA%\Programs\Seven\seven.ico" exit /b 1
          if not exist "%LOCALAPPDATA%\Programs\Seven\seven.svbc" exit /b 1
          if not exist "%APPDATA%\Microsoft\Windows\Start Menu\Programs\Seven.url" exit /b 1
          "%LOCALAPPDATA%\Programs\Seven\bin\seven.exe" --version
          reg query HKCU\Software\Classes\.sev >nul
          reg query HKCU\Software\Microsoft\Windows\CurrentVersion\Uninstall\Seven.Language >nul
          start /wait "" "%BUNDLE%\seven-installer.exe" --uninstall
          if errorlevel 1 exit /b 1
          reg query HKCU\Software\Classes\.sev >nul 2>&1 && exit /b 1
          reg query HKCU\Software\Microsoft\Windows\CurrentVersion\Uninstall\Seven.Language >nul 2>&1 && exit /b 1
          if exist "%APPDATA%\Microsoft\Windows\Start Menu\Programs\Seven.url" exit /b 1
          if exist "%LOCALAPPDATA%\Programs\Seven\bin\seven.exe" exit /b 1

      - name: Upload Windows bundle and Seven images
        uses: actions/upload-artifact@v4
        with:
          name: seven-windows-x64
          path: |
            build/installers/seven-0.1.0-windows-x64/
            build/*.svbc
          if-no-files-found: error

  linux:
    name: Linux compiler and installer
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject retired PowerShell bridge
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f \( -name '*.ps1' -o -name '*.psm1' \) -print -quit | grep -q .; then
            echo 'PowerShell bridge file found'
            exit 1
          fi

      - name: Reconstruct and verify native seeds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/native-seeds
          : > build/native-seeds.zip
          for part in seed/native/archive/native-seeds.b64.*; do
            tr -cd 'A-Za-z0-9+/=' < "$part" | base64 --decode >> build/native-seeds.zip
          done
          echo '207b4d92a4bfd4d8dc32cba05c5d6b24cc6f7b62e87210de81eb3addc85f50a4  build/native-seeds.zip' | sha256sum --check
          unzip -q build/native-seeds.zip -d build/native-seeds
          cd build/native-seeds
          echo '6c65dee95cbb3fe2b99a05bbe65a18dd11b3621b59f5f6bb431a5584a062ef86  seven-windows.exe' | sha256sum --check
          echo '2192b7576e485a4bbd0a267cb18a836652c2b2de8953937a81992cbc52d6ad0f  seven-installer-windows.exe' | sha256sum --check
          echo 'f91edfecd7620922109609d89be16426f6f1535e02b03631b4bcd5c174e5405f  seven-linux' | sha256sum --check
          echo '8d5b9c534018d8b8ccca7fcdfaa6f7d40587c8a039d63ae214c62f93d35d533e  seven-installer-linux' | sha256sum --check
          chmod +x seven-linux seven-installer-linux

      - name: Materialize and verify Seven images on Linux
        shell: bash
        run: |
          set -euo pipefail
          build/native-seeds/seven-linux --version
          build/native-seeds/seven-linux check compiler/seven.sev
          build/native-seeds/seven-linux build compiler/seven.sev build/seven.svbc
          build/native-seeds/seven-linux build compiler/seven.sev build/seven.self.svbc
          build/native-seeds/seven-linux build runtime/host/seven.sev build/seven.host.svbc
          build/native-seeds/seven-linux build runtime/launcher/seven.sev build/seven.launcher.svbc
          build/native-seeds/seven-linux build runtime/installer/seven.sev build/seven.installer.svbc
          cmp build/seven.svbc build/seven.self.svbc
          build/native-seeds/seven-linux verify foundation
          build/native-seeds/seven-linux verify bootstrap
          build/native-seeds/seven-linux doctor

      - name: Assemble Linux installer bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle='build/installers/seven-0.1.0-linux-x64'
          mkdir -p "$bundle/payload/bin" "$bundle/payload/std"
          install -m 0755 build/native-seeds/seven-installer-linux "$bundle/seven-installer"
          install -m 0755 build/native-seeds/seven-linux "$bundle/payload/bin/seven"
          install -m 0644 build/seven.svbc "$bundle/payload/seven.svbc"
          install -m 0644 build/seven.host.svbc "$bundle/payload/seven.host.svbc"
          install -m 0644 build/seven.launcher.svbc "$bundle/payload/seven.launcher.svbc"
          install -m 0644 brand/seven.ico "$bundle/payload/seven.ico"
          install -m 0644 brand/seven-mark.svg "$bundle/payload/seven-mark.svg"
          install -m 0644 LICENSE "$bundle/payload/LICENSE"
          install -m 0644 NOTICE "$bundle/payload/NOTICE"
          cp -R std/. "$bundle/payload/std/"
          sha256sum "$bundle/seven-installer" > "$bundle/seven-installer.sha256"

      - name: Test Linux installation and removal
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/seven-home"
          bundle="$GITHUB_WORKSPACE/build/installers/seven-0.1.0-linux-x64"
          mkdir -p "$HOME"
          cd "$bundle"
          ./seven-installer
          test -x "$HOME/.local/share/seven/bin/seven"
          test -L "$HOME/.local/bin/seven"
          test -f "$HOME/.local/share/applications/seven.desktop"
          test -f "$HOME/.local/share/mime/packages/seven.xml"
          test -f "$HOME/.local/share/icons/hicolor/scalable/apps/seven.svg"
          test -f "$HOME/.local/share/seven/seven.ico"
          "$HOME/.local/bin/seven" --version
          ./seven-installer --uninstall
          test ! -e "$HOME/.local/bin/seven"
          test ! -e "$HOME/.local/share/seven"
          test ! -e "$HOME/.local/share/applications/seven.desktop"
          test ! -e "$HOME/.local/share/mime/packages/seven.xml"
          test ! -e "$HOME/.local/share/icons/hicolor/scalable/apps/seven.svg"

      - name: Upload Linux bundle
        uses: actions/upload-artifact@v4
        with:
          name: seven-linux-x64
          path: build/installers/seven-0.1.0-linux-x64/
          if-no-files-found: error
