name: Seven Native Foundation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seven-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  selfhost:
    name: Materialize self-hosted Seven toolchain
    uses: ./.github/workflows/stage1-compiler-probe.yml

  windows:
    name: Windows self-hosted compiler and installer
    needs: selfhost
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: seven-stage1-self-hosting
          path: build

      - name: Exercise self-hosted Windows compiler
        shell: bash
        run: |
          set -euo pipefail
          seven="$PWD/build/native/windows/seven.exe"
          test -s "$seven"
          "$seven" --version
          "$seven" check examples/hello.sev
          if "$seven" check conformance/invalid/unknown_name.sev; then
            echo 'invalid source was accepted'
            exit 1
          fi
          "$seven" build examples/hello.sev build/windows-hello.svbc
          "$seven" run examples/hello.sev
          "$seven" web build examples/hello.sev build/web-windows
          "$seven" doctor
          test -s build/windows-hello.svbc
          test -s build/web-windows/app.wasm
          test -s build/web-windows/seven.web.json

      - name: Install, execute and uninstall self-hosted Windows package
        shell: cmd
        run: |
          set "B=%CD%\build\installers\seven-0.1.0-windows-x64"
          if not exist "%B%\seven-installer.exe" exit /b 1
          pushd "%B%"
          start /wait "" ".\seven-installer.exe"
          if errorlevel 1 exit /b 1
          popd
          if not exist "%LOCALAPPDATA%\Programs\Seven\bin\seven.exe" exit /b 1
          if not exist "%LOCALAPPDATA%\Programs\Seven\bin\seven.svbc" exit /b 1
          "%LOCALAPPDATA%\Programs\Seven\bin\seven.exe" --version
          if errorlevel 1 exit /b 1
          "%LOCALAPPDATA%\Programs\Seven\bin\seven.exe" check examples/hello.sev
          if errorlevel 1 exit /b 1
          pushd "%B%"
          start /wait "" ".\seven-installer.exe" --uninstall
          if errorlevel 1 exit /b 1
          popd

  linux:
    name: Linux self-hosted compiler and installer
    needs: selfhost
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: seven-stage1-self-hosting
          path: build

      - name: Exercise self-hosted Linux compiler
        shell: bash
        run: |
          set -euo pipefail
          chmod +x build/native/linux/seven build/installers/seven-0.1.0-linux-x64/seven-installer
          seven="$PWD/build/native/linux/seven"
          "$seven" --version
          "$seven" check examples/hello.sev
          if "$seven" check conformance/invalid/unknown_name.sev; then
            echo 'invalid source was accepted'
            exit 1
          fi
          "$seven" build examples/hello.sev build/linux-hello.svbc
          "$seven" run examples/hello.sev
          "$seven" web build examples/hello.sev build/web-linux
          "$seven" doctor
          test -s build/linux-hello.svbc
          test -s build/web-linux/app.wasm
          test -s build/web-linux/seven.web.json

      - name: Install, execute and uninstall self-hosted Linux package
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/seven-home"
          b="$GITHUB_WORKSPACE/build/installers/seven-0.1.0-linux-x64"
          mkdir -p "$HOME"
          cd "$b"
          ./seven-installer
          test -x "$HOME/.local/share/seven/bin/seven"
          test -f "$HOME/.local/share/seven/bin/seven.svbc"
          "$HOME/.local/share/seven/bin/seven" --version
          "$HOME/.local/share/seven/bin/seven" check "$GITHUB_WORKSPACE/examples/hello.sev"
          ./seven-installer --uninstall
          test ! -e "$HOME/.local/share/seven"
