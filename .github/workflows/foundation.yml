name: Seven Native Foundation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seven-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  current:
    name: Current self-hosted foundation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Enforce minimal foreign bootstrap boundary
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(
            find . -type f               \( -name '*.ps1' -o -name '*.psm1' -o -name '*.c' -o -name '*.cc' -o -name '*.cpp' -o -name '*.cxx'                  -o -name '*.rs' -o -name '*.go' -o -name '*.py' -o -name '*.js' -o -name '*.ts' -o -name '*.cs' \)               ! -path './bootstrap/host/v2/genesis-host.c'               ! -path './website/assets/*'               -print -quit
          )"
          if test -n "$unexpected"; then
            echo "forbidden implementation source: $unexpected"
            exit 1
          fi

      - name: Build current self-hosted Seven
        uses: ./.github/actions/self-hosted-seven

      - name: Verify fixed points and provenance
        shell: bash
        run: |
          set -euo pipefail
          cmp build/seven0.svbc build/seven0.self.svbc
          cmp build/seven.stage2.svbc build/seven.stage2.self.svbc
          grep -q '^stage2_fixed_point sim$' build/current-seven/PROVENANCE
          grep -q '^transition_seed nao$' build/current-seven/PROVENANCE
          if grep -n 'seed/native/final/v1' .github/workflows/foundation.yml; then
            echo 'Foundation still references the archived transition compiler.'
            exit 1
          fi

      - name: Exercise current compiler bundle
        shell: bash
        run: |
          set -euo pipefail
          if test "$RUNNER_OS" = "Windows"; then
            seven="$PWD/build/current-seven/bin/seven.exe"
          else
            seven="$PWD/build/current-seven/bin/seven"
          fi

          "$seven" --version
          "$seven" doctor
          "$seven" check examples/hello.sev
          "$seven" build examples/hello.sev build/foundation-hello.svbc
          "$seven" web build examples/web_dev.sev build/foundation-web
          test -s build/foundation-hello.svbc
          test -s build/foundation-web/app.wasm
          test -s build/foundation-web/seven.web.json

      - uses: actions/upload-artifact@v4
        with:
          name: seven-current-foundation-${{ matrix.os }}
          path: build/current-seven/
          if-no-files-found: error
