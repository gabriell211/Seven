name: Seven Native Foundation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seven-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compiler:
    name: Rebuild current Seven compiler image
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Rebuild deterministic source-backed compiler
        shell: bash
        run: |
          set -euo pipefail
          bash tests/compiler/build_transition_compiler.sh
          cmp build/seven.transition.svbc build/seven.transition.self.svbc
          sha256sum build/seven.transition.svbc

      - uses: actions/upload-artifact@v4
        with:
          name: seven-current-compiler-image
          path: build/seven.transition.svbc
          if-no-files-found: error

  windows:
    name: Windows source-backed compiler and installer
    needs: compiler
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          name: seven-current-compiler-image
          path: build/image

      - name: Enforce Seven-only implementation boundary
        shell: cmd
        run: |
          for /r %%F in (*.ps1 *.psm1 *.c *.cc *.cpp *.cxx *.rs *.go *.py *.js *.ts *.cs) do (
            echo %%~fF | findstr /i /c:"\bootstrap\host\v2\genesis-host.c" >nul
            if errorlevel 1 (
              echo forbidden implementation source: %%F
              exit /b 1
            )
          )

      - name: Reconstruct legacy Windows installer only
        shell: bash
        run: |
          set -euo pipefail
          (cd bootstrap/host/v2 && sha256sum --check SHA256SUMS)
          mkdir -p build/native-seeds
          cat seed/native/final/v1/part*.b64 | tr -d '\r\n\t ' | base64 --decode > build/native-seeds.zip
          echo '670646ab39df2f2a111c664e16023af3ddc3b203982945609193da99d8c4bac7  build/native-seeds.zip' | sha256sum --check
          unzip -t build/native-seeds.zip
          unzip -q build/native-seeds.zip -d build/native-seeds
          echo 'e4847375d1e800425e23253d36394bc8d2a2d9a97598f8905a30986310f176ed  build/native-seeds/seven-installer-windows.exe' | sha256sum --check

      - name: Build current Windows release host
        shell: bash
        run: |
          set -euo pipefail
          root="$PWD/build/current-windows"
          mkdir -p "$root/bin"
          cp build/image/seven.transition.svbc "$root/seven.svbc"
          cp -R std "$root/std"
          clang -DSEVEN_RELEASE_HOST -O2 -std=c11 -Wall -Wextra -Werror \
            bootstrap/host/v2/genesis-host.c -o "$root/bin/seven.exe"

          seven="$root/bin/seven.exe"
          "$seven" --version
          "$seven" check examples/hello.sev
          if "$seven" check conformance/invalid/unknown_name.sev; then
            echo 'invalid source was accepted'
            exit 1
          fi
          "$seven" run examples/hello.sev | tee build/windows-run.txt
          grep -q 'Seven nasceu.' build/windows-run.txt
          "$seven" web build examples/web_app.sev build/web-windows
          test -s build/web-windows/app.wasm
          test -s build/web-windows/seven.web.json
          test "$(od -An -tx1 -N4 build/web-windows/app.wasm | tr -d ' \n')" = '0061736d'
          "$seven" build runtime/host/seven.sev build/seven.host.svbc
          "$seven" build runtime/launcher/seven.sev build/seven.launcher.svbc
          "$seven" doctor | tee build/windows-doctor.txt
          grep -q 'compiler: source-backed' build/windows-doctor.txt

      - name: Assemble Windows bundle
        shell: cmd
        run: |
          set "B=build\installers\seven-0.2.0-windows-x64"
          mkdir "%B%\payload\bin" || exit /b 1
          mkdir "%B%\payload\std" || exit /b 1
          copy /y build\native-seeds\seven-installer-windows.exe "%B%\seven-installer.exe" || exit /b 1
          copy /y build\current-windows\bin\seven.exe "%B%\payload\bin\seven.exe" || exit /b 1
          copy /y build\image\seven.transition.svbc "%B%\payload\seven.svbc" || exit /b 1
          copy /y build\seven.host.svbc "%B%\payload\seven.host.svbc" || exit /b 1
          copy /y build\seven.launcher.svbc "%B%\payload\seven.launcher.svbc" || exit /b 1
          copy /y brand\seven.ico "%B%\payload\seven.ico" || exit /b 1
          copy /y brand\seven-mark.svg "%B%\payload\seven-mark.svg" || exit /b 1
          copy /y LICENSE "%B%\payload\LICENSE" || exit /b 1
          copy /y NOTICE "%B%\payload\NOTICE" || exit /b 1
          xcopy std "%B%\payload\std" /E /I /Y >nul || exit /b 1
          certutil -hashfile "%B%\payload\bin\seven.exe" SHA256 > "%B%\seven.exe.sha256" || exit /b 1
          certutil -hashfile "%B%\payload\seven.svbc" SHA256 > "%B%\seven.svbc.sha256" || exit /b 1

      - name: Install, execute and uninstall on Windows
        shell: cmd
        run: |
          set "B=%CD%\build\installers\seven-0.2.0-windows-x64"
          pushd "%B%"
          start /wait "" ".\seven-installer.exe"
          if errorlevel 1 exit /b 1
          popd
          if not exist "%LOCALAPPDATA%\Programs\Seven\bin\seven.exe" exit /b 1
          if not exist "%LOCALAPPDATA%\Programs\Seven\seven.svbc" exit /b 1
          if not exist "%APPDATA%\Microsoft\Windows\Start Menu\Programs\Seven.url" exit /b 1
          "%LOCALAPPDATA%\Programs\Seven\bin\seven.exe" --version
          if errorlevel 1 exit /b 1
          "%LOCALAPPDATA%\Programs\Seven\bin\seven.exe" check examples/hello.sev
          if errorlevel 1 exit /b 1
          "%LOCALAPPDATA%\Programs\Seven\bin\seven.exe" run examples/hello.sev > build\installed-run-windows.txt
          if errorlevel 1 exit /b 1
          findstr /c:"Seven nasceu." build\installed-run-windows.txt >nul
          if errorlevel 1 exit /b 1
          "%LOCALAPPDATA%\Programs\Seven\bin\seven.exe" web build examples/web_app.sev build/installed-web-windows
          if errorlevel 1 exit /b 1
          if not exist build\installed-web-windows\app.wasm exit /b 1
          reg query HKCU\Software\Classes\.sev >nul
          if errorlevel 1 exit /b 1
          reg query HKCU\Software\Microsoft\Windows\CurrentVersion\Uninstall\Seven.Language >nul
          if errorlevel 1 exit /b 1
          pushd "%B%"
          start /wait "" ".\seven-installer.exe" --uninstall
          if errorlevel 1 exit /b 1
          popd
          if exist "%LOCALAPPDATA%\Programs\Seven\bin\seven.exe" exit /b 1
          if exist "%APPDATA%\Microsoft\Windows\Start Menu\Programs\Seven.url" exit /b 1
          reg query HKCU\Software\Classes\.sev >nul 2>&1 && exit /b 1
          reg query HKCU\Software\Microsoft\Windows\CurrentVersion\Uninstall\Seven.Language >nul 2>&1 && exit /b 1
          exit /b 0

      - name: Reject opaque compiler payload
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'native-seeds/seven-windows.exe' .github/workflows/foundation.yml

      - uses: actions/upload-artifact@v4
        with:
          name: seven-0.2.0-windows-x64
          path: build/installers/seven-0.2.0-windows-x64/
          if-no-files-found: error

  linux:
    name: Linux source-backed compiler and installer
    needs: compiler
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v4
        with:
          name: seven-current-compiler-image
          path: build/image

      - name: Enforce Seven-only implementation boundary
        shell: bash
        run: |
          set -euo pipefail
          if find . -type f \( -name '*.ps1' -o -name '*.psm1' -o -name '*.c' -o -name '*.cc' -o -name '*.cpp' -o -name '*.cxx' -o -name '*.rs' -o -name '*.go' -o -name '*.py' -o -name '*.js' -o -name '*.ts' -o -name '*.cs' \) ! -path './bootstrap/host/v2/genesis-host.c' -print -quit | grep -q .; then
            exit 1
          fi

      - name: Reconstruct legacy Linux installer only
        shell: bash
        run: |
          set -euo pipefail
          (cd bootstrap/host/v2 && sha256sum --check SHA256SUMS)
          mkdir -p build/native-seeds
          cat seed/native/final/v1/part*.b64 | tr -d '\r\n\t ' | base64 --decode > build/native-seeds.zip
          echo '670646ab39df2f2a111c664e16023af3ddc3b203982945609193da99d8c4bac7  build/native-seeds.zip' | sha256sum --check
          unzip -t build/native-seeds.zip
          unzip -q build/native-seeds.zip -d build/native-seeds
          echo '8d5b9c534018d8b8ccca7fcdfaa6f7d40587c8a039d63ae214c62f93d35d533e  build/native-seeds/seven-installer-linux' | sha256sum --check
          chmod +x build/native-seeds/seven-installer-linux

      - name: Build current Linux release host
        shell: bash
        run: |
          set -euo pipefail
          root="$PWD/build/current-linux"
          mkdir -p "$root/bin"
          cp build/image/seven.transition.svbc "$root/seven.svbc"
          cp -R std "$root/std"
          gcc -DSEVEN_RELEASE_HOST -O2 -std=c11 -Wall -Wextra -Werror \
            bootstrap/host/v2/genesis-host.c -o "$root/bin/seven"
          chmod +x "$root/bin/seven"

          seven="$root/bin/seven"
          "$seven" --version
          "$seven" check examples/hello.sev
          if "$seven" check conformance/invalid/unknown_name.sev; then
            echo 'invalid source was accepted'
            exit 1
          fi
          "$seven" run examples/hello.sev | tee build/linux-run.txt
          grep -q 'Seven nasceu.' build/linux-run.txt
          "$seven" web build examples/web_app.sev build/web-linux
          test -s build/web-linux/app.wasm
          test -s build/web-linux/seven.web.json
          test "$(od -An -tx1 -N4 build/web-linux/app.wasm | tr -d ' \n')" = '0061736d'
          "$seven" build runtime/host/seven.sev build/seven.host.svbc
          "$seven" build runtime/launcher/seven.sev build/seven.launcher.svbc
          "$seven" doctor | tee build/linux-doctor.txt
          grep -q 'compiler: source-backed' build/linux-doctor.txt

      - name: Assemble Linux bundle
        shell: bash
        run: |
          set -euo pipefail
          b='build/installers/seven-0.2.0-linux-x64'
          mkdir -p "$b/payload/bin" "$b/payload/std"
          install -m 0755 build/native-seeds/seven-installer-linux "$b/seven-installer"
          install -m 0755 build/current-linux/bin/seven "$b/payload/bin/seven"
          install -m 0644 build/image/seven.transition.svbc "$b/payload/seven.svbc"
          install -m 0644 build/seven.host.svbc "$b/payload/seven.host.svbc"
          install -m 0644 build/seven.launcher.svbc "$b/payload/seven.launcher.svbc"
          install -m 0644 brand/seven.ico "$b/payload/seven.ico"
          install -m 0644 brand/seven-mark.svg "$b/payload/seven-mark.svg"
          install -m 0644 LICENSE NOTICE "$b/payload/"
          cp -R std/. "$b/payload/std/"
          sha256sum "$b/payload/bin/seven" > "$b/seven.sha256"
          sha256sum "$b/payload/seven.svbc" > "$b/seven.svbc.sha256"

      - name: Install, execute and uninstall on Linux
        shell: bash
        run: |
          set -euo pipefail
          export HOME="$RUNNER_TEMP/seven-home"
          b="$GITHUB_WORKSPACE/build/installers/seven-0.2.0-linux-x64"
          mkdir -p "$HOME"
          cd "$b"
          ./seven-installer
          test -x "$HOME/.local/share/seven/bin/seven"
          test -L "$HOME/.local/bin/seven"
          test -f "$HOME/.local/share/applications/seven.desktop"
          test -f "$HOME/.local/share/mime/packages/seven.xml"
          test -f "$HOME/.local/share/icons/hicolor/scalable/apps/seven.svg"
          test -f "$HOME/.local/share/seven/seven.ico"
          test -f "$HOME/.local/share/seven/seven.svbc"
          "$HOME/.local/bin/seven" --version
          "$HOME/.local/bin/seven" check "$GITHUB_WORKSPACE/examples/hello.sev"
          "$HOME/.local/bin/seven" run "$GITHUB_WORKSPACE/examples/hello.sev" | tee "$GITHUB_WORKSPACE/build/installed-run-linux.txt"
          grep -q 'Seven nasceu.' "$GITHUB_WORKSPACE/build/installed-run-linux.txt"
          "$HOME/.local/bin/seven" web build "$GITHUB_WORKSPACE/examples/web_app.sev" "$GITHUB_WORKSPACE/build/installed-web-linux"
          test -s "$GITHUB_WORKSPACE/build/installed-web-linux/app.wasm"
          ./seven-installer --uninstall
          test ! -e "$HOME/.local/bin/seven"
          test ! -e "$HOME/.local/share/seven"

      - name: Reject opaque compiler payload
        shell: bash
        run: |
          set -euo pipefail
          ! grep -q 'native-seeds/seven-linux' .github/workflows/foundation.yml

      - uses: actions/upload-artifact@v4
        with:
          name: seven-0.2.0-linux-x64
          path: build/installers/seven-0.2.0-linux-x64/
          if-no-files-found: error
