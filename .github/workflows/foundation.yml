name: Seven Native Foundation

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seven-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-windows:
    name: Verify Seven directly on Windows
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reject retired PowerShell bridge
        shell: cmd
        run: |
          if exist tools\seven-dev.ps1 exit /b 1
          if exist tools\seven-lsp.ps1 exit /b 1
          if exist tools\verify-foundation.ps1 exit /b 1
          if exist tools\Seven.Foundation.psm1 exit /b 1

      - name: Verify bootstrap compiler
        shell: cmd
        run: bin\seven.exe --version

      - name: Check Seven sources
        shell: cmd
        run: |
          bin\seven.exe check compiler0\seven0.sev
          bin\seven.exe check compiler\seven.sev
          bin\seven.exe check runtime\host\seven.sev
          bin\seven.exe check runtime\launcher\seven.sev
          bin\seven.exe check runtime\installer\seven.sev
          bin\seven.exe check bootstrap\native-release.sev
          bin\seven.exe check compiler\toolchain\verify.sev
          bin\seven.exe check compiler\toolchain\bootstrap_chain.sev
          bin\seven.exe check compiler\toolchain\production_audit.sev

      - name: Run Seven bootstrap smoke test
        shell: cmd
        run: bin\seven.exe run examples\hello.sev

      - name: Materialize compiler images
        shell: cmd
        run: |
          bin\seven.exe build compiler0\seven0.sev build\seven0.svbc
          bin\seven.exe build compiler\seven.sev build\seven.svbc
          bin\seven.exe build compiler\seven.sev build\seven.self.svbc
          bin\seven.exe build runtime\host\seven.sev build\seven.host.svbc
          bin\seven.exe build runtime\launcher\seven.sev build\seven.launcher.svbc
          bin\seven.exe build runtime\installer\seven.sev build\seven.installer.svbc

      - name: Verify deterministic compiler image
        shell: cmd
        run: fc /b build\seven.svbc build\seven.self.svbc

      - name: Build native compiler and installers from Seven
        shell: cmd
        run: bin\seven.exe run bootstrap\native-release.sev

      - name: Verify Windows installer bundle
        shell: cmd
        run: |
          if not exist build\installers\seven-0.1.0-windows-x64\seven-installer.exe exit /b 1
          if not exist build\installers\seven-0.1.0-windows-x64\payload\seven.ico exit /b 1
          if not exist build\installers\seven-0.1.0-windows-x64\payload\seven.exe exit /b 1

      - name: Verify Linux installer bundle
        shell: cmd
        run: |
          if not exist build\installers\seven-0.1.0-linux-x64\seven-installer exit /b 1
          if not exist build\installers\seven-0.1.0-linux-x64\payload\seven.ico exit /b 1
          if not exist build\installers\seven-0.1.0-linux-x64\payload\seven-mark.svg exit /b 1

      - name: Upload installer bundles
        uses: actions/upload-artifact@v4
        with:
          name: seven-installers
          path: build/installers/
          if-no-files-found: error

  verify-linux:
    name: Verify Linux installer layout
    runs-on: ubuntu-latest
    needs: verify-windows
    timeout-minutes: 10

    steps:
      - name: Download installer bundles
        uses: actions/download-artifact@v4
        with:
          name: seven-installers
          path: build/installers

      - name: Verify Linux executable and icons
        shell: bash
        run: |
          test -f build/installers/seven-0.1.0-linux-x64/seven-installer
          test -f build/installers/seven-0.1.0-linux-x64/payload/seven
          test -f build/installers/seven-0.1.0-linux-x64/payload/seven.ico
          test -f build/installers/seven-0.1.0-linux-x64/payload/seven-mark.svg
          chmod +x build/installers/seven-0.1.0-linux-x64/seven-installer
          chmod +x build/installers/seven-0.1.0-linux-x64/payload/seven
