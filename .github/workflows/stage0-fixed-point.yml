name: Seven Stage 0 Fixed Point

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seven-stage0-fixed-point-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fixed-point:
    name: Seven-0 fixed point (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            host: build/genesis-host
          - os: windows-latest
            host: build/genesis-host.exe

    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct audited Stage 0 input
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          cat bootstrap/seed/v2/part*.b64 | tr -d '\r\n\t ' | base64 --decode | gzip --decompress > build/seven0.seed.svbc
          echo '123f5b513bcae7774671898f471441b3c71efd570acad91fa634cbc5f33bb223  build/seven0.seed.svbc' | sha256sum --check
          (cd bootstrap/host/v2 && sha256sum --check SHA256SUMS)

      - name: Generate deterministic Seven-0 monolith
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'modulo seven0_bootstrap_monolith\n\n'
            for arquivo in $(find compiler0 -maxdepth 1 -type f -name '*.sev' | LC_ALL=C sort); do
              nome=$(basename "$arquivo")
              printf '// BEGIN %s\n' "$nome"
              sed '/^modulo /d; /^usa /d' "$arquivo"
              printf '// END %s\n\n' "$nome"
            done
          } > build/seven0.monolith.sev
          sha256sum build/seven0.monolith.sev | tee build/seven0-source.sha256

      - name: Build Genesis host on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          gcc -O2 -std=c11 -Wall -Wextra -Werror bootstrap/host/v2/genesis-host.c -o build/genesis-host
          chmod +x build/genesis-host

      - name: Build Genesis host on Windows
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          clang -D_CRT_SECURE_NO_WARNINGS -O2 -std=c11 -Wall -Wextra -Werror bootstrap/host/v2/genesis-host.c -lws2_32 -o build/genesis-host.exe

      - name: Rebuild Seven-0 to a fixed point
        shell: bash
        run: |
          set -euo pipefail
          host="$PWD/${{ matrix.host }}"
          "$host" build/seven0.seed.svbc build/seven0.monolith.sev build/seven0.svbc
          "$host" build/seven0.svbc build/seven0.monolith.sev build/seven0.self.svbc
          cmp build/seven0.svbc build/seven0.self.svbc
          sha256sum build/seven0.svbc | tee build/seven0-output.sha256
          wc -c build/seven0.svbc | tee build/seven0-output.size
          test "$(od -An -tx1 -N4 build/seven0.svbc | tr -d ' \n')" = '53564230'

      - name: Compile and execute a fresh Seven program
        shell: bash
        run: |
          set -euo pipefail
          host="$PWD/${{ matrix.host }}"
          cat > build/stage0-proof.sev <<'EOF'
          modulo stage0.prova

          campo inicio() -> Num ::
            devolve 42
          fecha
          EOF

          "$host" build/seven0.svbc build/stage0-proof.sev build/stage0-proof.svbc
          test "$(od -An -tx1 -N4 build/stage0-proof.svbc | tr -d ' \n')" = '53564230'
          set +e
          "$host" build/stage0-proof.svbc
          proof_exit=$?
          set -e
          test "$proof_exit" -eq 42

      - name: Record fixed-point provenance
        shell: bash
        run: |
          set -euo pipefail
          host_hash=$(sha256sum "${{ matrix.host }}" | awk '{print $1}')
          host_source_hash=$(cat bootstrap/host/v2/genesis-host.c bootstrap/host/v2/genesis-host.part*.inc | sha256sum | awk '{print $1}')
          source_hash=$(sha256sum build/seven0.monolith.sev | awk '{print $1}')
          output_hash=$(sha256sum build/seven0.svbc | awk '{print $1}')
          proof_hash=$(sha256sum build/stage0-proof.svbc | awk '{print $1}')
          cat > build/stage0-fixed-point.provenance <<EOF
          formato seven-bootstrap-provenance-v2
          etapa stage0
          executor ${{ matrix.host }}
          executor_sha256 $host_hash
          executor_fontes bootstrap/host/v2
          executor_fontes_sha256 $host_source_hash
          seed build/seven0.seed.svbc
          seed_sha256 123f5b513bcae7774671898f471441b3c71efd570acad91fa634cbc5f33bb223
          entrada build/seven0.monolith.sev
          entrada_sha256 $source_hash
          saida build/seven0.svbc
          saida_sha256 $output_hash
          autorebuild build/seven0.self.svbc
          prova build/stage0-proof.svbc
          prova_sha256 $proof_hash
          prova_exit 42
          fixed_point sim
          EOF
          cat build/stage0-fixed-point.provenance

      - uses: actions/upload-artifact@v7
        with:
          name: seven-stage0-fixed-point-${{ matrix.os }}
          path: |
            ${{ matrix.host }}
            build/seven0.svbc
            build/seven0.self.svbc
            build/seven0.monolith.sev
            build/stage0-proof.sev
            build/stage0-proof.svbc
            build/stage0-fixed-point.provenance
          if-no-files-found: error
