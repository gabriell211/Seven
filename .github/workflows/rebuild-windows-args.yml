name: Rebuild Windows Bootstrap Arguments

on:
  push:
    branches:
      - gabriell211/production-readiness
    paths:
      - .github/scripts/rebuild-windows-args.sh
      - .github/workflows/rebuild-windows-args.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seven-windows-args-rebuild
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gabriell211/production-readiness
          fetch-depth: 0

      - name: Rebuild and validate Windows argument parsing
        shell: bash
        run: bash .github/scripts/rebuild-windows-args.sh
