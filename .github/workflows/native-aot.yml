name: Seven Native AOT

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seven-native-aot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Stage1 emits and executes ELF64
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct audited Seven bootstrap
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          cat bootstrap/seed/v2/part*.b64 | tr -d '\r\n\t ' | base64 --decode | gzip --decompress > build/seven0.seed.svbc
          echo '123f5b513bcae7774671898f471441b3c71efd570acad91fa634cbc5f33bb223  build/seven0.seed.svbc' | sha256sum --check
          (cd bootstrap/host/v2 && sha256sum --check SHA256SUMS)
          gcc -O2 -std=c11 -Wall -Wextra -Werror bootstrap/host/v2/genesis-host.c -o build/genesis-host

      - name: Rebuild Seven-0 fixed point
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'modulo seven0_bootstrap_monolith\n\n'
            for arquivo in $(find compiler0 -maxdepth 1 -type f -name '*.sev' | LC_ALL=C sort); do
              printf '// BEGIN %s\n' "$(basename "$arquivo")"
              sed '/^modulo /d; /^usa /d' "$arquivo"
              printf '// END %s\n\n' "$(basename "$arquivo")"
            done
          } > build/seven0.monolith.sev
          build/genesis-host build/seven0.seed.svbc build/seven0.monolith.sev build/seven0.svbc
          build/genesis-host build/seven0.svbc build/seven0.monolith.sev build/seven0.self.svbc
          cmp build/seven0.svbc build/seven0.self.svbc

      - name: Build Stage1 compiler
        shell: bash
        run: |
          set -euo pipefail
          cat > build/stage1.sources <<'EOF'
          std/base/lista.sev
          std/base/resultado.sev
          std/base/talvez.sev
          std/base/mapa.sev
          std/base/texto.sev
          std/mem/bytes.sev
          std/fs/file.sev
          compiler/ast.sev
          compiler/bytecode.sev
          compiler/diagnostic.sev
          compiler/driver.sev
          compiler/effects.sev
          compiler/emitter.sev
          compiler/ffi.sev
          compiler/ir.sev
          compiler/lexer.sev
          compiler/memory.sev
          compiler/package.sev
          compiler/parser_part00.sev
          compiler/parser_part01.sev
          compiler/parser_part02.sev
          compiler/parser_part03.sev
          compiler/parser_part04.sev
          compiler/parser_part05.sev
          compiler/parser_cursor.sev
          compiler/semantic.sev
          compiler/source.sev
          compiler/symbols.sev
          compiler/token.sev
          compiler/types_part00.sev
          compiler/types_part01.sev
          compiler/types_part02.sev
          compiler/types_part03.sev
          EOF

          {
            printf 'modulo seven_stage1_monolith\n\n'
            while IFS= read -r arquivo; do
              printf '// BEGIN %s\n' "$arquivo"
              case "$arquivo" in
                compiler/bytecode.sev)
                  sed '/^modulo /d; /^usa /d; s/emite_constante(/bytecode_emite_constante(/g' "$arquivo"
                  ;;
                compiler/emitter.sev)
                  sed '/^modulo /d; /^usa /d; s/^campo emite(/campo emite_formato(/' "$arquivo"
                  ;;
                *)
                  sed '/^modulo /d; /^usa /d' "$arquivo"
                  ;;
              esac
              printf '// END %s\n\n' "$arquivo"
            done < build/stage1.sources

            cat <<'EOF'
          campo inicio(argumentos: Lista<Texto>) -> Num toca terminal, disco, ambiente ::
            guarda pedido := pedido_de_compilacao(argumentos)
            guarda saida := compila(pedido)
            veja saida e Sucesso ::
              devolve 0
            outro ::
              mostra_diagnosticos(saida.diagnosticos)
              devolve 1
            fecha
          fecha
          EOF
          } > build/seven.stage1.monolith.sev

          build/genesis-host build/seven0.svbc build/seven.stage1.monolith.sev build/seven.stage1.svbc
          test "$(od -An -tx1 -N4 build/seven.stage1.svbc | tr -d ' \n')" = '53564230'

      - name: Prepare native runtime source set
        shell: bash
        run: |
          set -euo pipefail
          cat > build/native-core.sources <<'EOF'
          std/base/lista.sev
          std/base/resultado.sev
          std/base/talvez.sev
          std/base/mapa.sev
          std/base/texto.sev
          std/mem/bytes.sev
          std/fs/file.sev
          runtime/platform/abi.sev
          runtime/svbc/opcode.sev
          runtime/svbc/value.sev
          runtime/svbc/image.sev
          runtime/platform/native/bytes.sev
          runtime/platform/native/target.sev
          runtime/platform/native/object_runtime.sev
          runtime/platform/native/bytes_core.sev
          runtime/platform/native/syscall_bytes.sev
          runtime/platform/native/syscall_objects.sev
          runtime/platform/native/syscall_dispatch.sev
          runtime/platform/native/x64.sev
          runtime/platform/native/elf.sev
          runtime/platform/native/pe.sev
          runtime/platform/native/linker.sev
          EOF

      - name: Compile native AOT baseline with Stage1
        shell: bash
        run: |
          set -euo pipefail
          cp build/native-core.sources build/native-aot.sources
          echo 'tests/native/aot_backend.sev' >> build/native-aot.sources
          cat > build/native-aot.pkg <<'EOF'
          pacote native-aot-proof
          versao 0.0.1
          criador Gabriel Barcelos
          entrada tests.native.aot_backend.inicio
          alvo svbc
          indice build/native-aot.sources
          EOF
          build/genesis-host build/seven.stage1.svbc build/native-aot.pkg build/native-aot-test.svbc
          test -s build/native-aot-test.svbc
          test "$(od -An -tx1 -N4 build/native-aot-test.svbc | tr -d ' \n')" = '53564243'

      - name: Compile native object/list proof with Stage1
        shell: bash
        run: |
          set -euo pipefail
          cp build/native-core.sources build/native-object.sources
          echo 'tests/native/object_backend.sev' >> build/native-object.sources
          cat > build/native-object.pkg <<'EOF'
          pacote native-object-proof
          versao 0.0.1
          criador Gabriel Barcelos
          entrada tests.native.object_backend.inicio
          alvo svbc
          indice build/native-object.sources
          EOF
          build/genesis-host build/seven.stage1.svbc build/native-object.pkg build/native-object-test.svbc
          test -s build/native-object-test.svbc
          test "$(od -An -tx1 -N4 build/native-object-test.svbc | tr -d ' \n')" = '53564243'

      - name: Validate stable SVBC call contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import struct
          import sys

          def validate(path):
              data = open(path, 'rb').read()
              pos = 0
              def take(n):
                  nonlocal pos
                  out = data[pos:pos+n]
                  if len(out) != n:
                      raise SystemExit(f'{path}: truncated SVBC at byte {pos}')
                  pos += n
                  return out
              def u8(): return take(1)[0]
              def u32(): return struct.unpack('>I', take(4))[0]
              def u64(): return struct.unpack('>Q', take(8))[0]
              def text(): return take(u32()).decode('utf-8')

              if take(4) != b'SVBC' or u32() != 1:
                  raise SystemExit(f'{path}: invalid stable SVBC header')
              names = [text() for _ in range(u32())]
              for _ in range(u32()):
                  tag = u8()
                  if tag == 0: pass
                  elif tag == 2: u8()
                  elif tag == 3: u64()
                  elif tag == 4: text()
                  else: raise SystemExit(f'{path}: unsupported constant tag {tag}')
              fields = []
              for _ in range(u32()):
                  name_index = u32()
                  entry = u64()
                  locals_count = u32()
                  params = u32()
                  for _ in range(u32()): u32()
                  fields.append((names[name_index], entry, locals_count, params))
              code = [(u8(), u32(), u32(), u32(), u64()) for _ in range(u32())]
              failures = 0
              for index, (op, a, b, c, source_ip) in enumerate(code):
                  if op != 16:
                      continue
                  caller = '<sem-campo>'
                  caller_entry = -1
                  for name, entry, locals_count, params in fields:
                      if entry <= index and entry >= caller_entry:
                          caller = name
                          caller_entry = entry
                  if a >= len(fields):
                      print(f'{path}: SVBC-CALL target-out-of-bounds caller={caller} code_index={index} source_ip={source_ip} target_index={a} got={b}', file=sys.stderr)
                      failures += 1
                      continue
                  target, entry, locals_count, expected = fields[a]
                  if b != expected:
                      print(f'{path}: SVBC-CALL arity-mismatch caller={caller} target={target} code_index={index} source_ip={source_ip} got={b} expected={expected}', file=sys.stderr)
                      failures += 1
              if failures:
                  raise SystemExit(f'{path}: {failures} invalid call site(s)')
              print(f'{path}: SVBC call validation OK: {len(fields)} fields, {len(code)} instructions')

          validate('build/native-aot-test.svbc')
          validate('build/native-object-test.svbc')
          PY

      - name: Execute Seven native generators in Genesis SVBC1 host
        shell: bash
        run: |
          set -euo pipefail
          build/genesis-host build/native-aot-test.svbc
          build/genesis-host build/native-object-test.svbc
          test "$(od -An -tx1 -N4 build/native-aot-proof | tr -d ' \n')" = '7f454c46'
          test "$(od -An -tx1 -N2 build/native-aot-proof.exe | tr -d ' \n')" = '4d5a'
          test "$(od -An -tx1 -N4 build/native-object-proof | tr -d ' \n')" = '7f454c46'
          test "$(od -An -tx1 -N2 build/native-object-proof.exe | tr -d ' \n')" = '4d5a'

      - name: Inspect generated native formats
        shell: bash
        run: |
          set -euo pipefail
          readelf -h build/native-aot-proof | tee build/native-aot-proof.elf.txt
          readelf -h build/native-object-proof | tee build/native-object-proof.elf.txt
          objdump -p build/native-aot-proof.exe | tee build/native-aot-proof.pe.txt
          objdump -p build/native-object-proof.exe | tee build/native-object-proof.pe.txt
          grep -q 'pei-x86-64' build/native-aot-proof.pe.txt
          grep -q 'pei-x86-64' build/native-object-proof.pe.txt
          grep -q 'KERNEL32.dll' build/native-object-proof.pe.txt
          grep -q 'VirtualAlloc' build/native-object-proof.pe.txt

      - name: Execute Seven-generated ELF proofs
        shell: bash
        run: |
          set -euo pipefail
          chmod +x build/native-aot-proof build/native-object-proof
          set +e
          ./build/native-aot-proof
          aot_code=$?
          ./build/native-object-proof
          object_code=$?
          set -e
          test "$aot_code" -eq 42
          test "$object_code" -eq 42

      - name: Reject transition native lowering
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -n 'sys_native_baixa' runtime compiler std

      - uses: actions/upload-artifact@v4
        with:
          name: seven-native-aot-proof
          path: |
            build/native-aot-proof
            build/native-aot-proof.exe
            build/native-object-proof
            build/native-object-proof.exe
            build/native-aot-test.svbc
            build/native-object-test.svbc
            build/native-aot-proof.elf.txt
            build/native-aot-proof.pe.txt
            build/native-object-proof.elf.txt
            build/native-object-proof.pe.txt
          if-no-files-found: error

  windows:
    name: Execute Stage1-generated PE32+ proofs
    needs: generate
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: seven-native-aot-proof
          path: build

      - name: Execute Seven-generated PE proofs
        shell: bash
        run: |
          set +e
          ./build/native-aot-proof.exe
          aot_code=$?
          ./build/native-object-proof.exe
          object_code=$?
          set -e
          test "$aot_code" -eq 42
          test "$object_code" -eq 42
