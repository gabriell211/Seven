name: Seven Native AOT

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seven-native-aot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate:
    name: Stage1 emits and executes ELF64
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct audited Seven bootstrap
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          cat bootstrap/seed/v2/part*.b64 | tr -d '\r\n\t ' | base64 --decode | gzip --decompress > build/seven0.seed.svbc
          echo '123f5b513bcae7774671898f471441b3c71efd570acad91fa634cbc5f33bb223  build/seven0.seed.svbc' | sha256sum --check
          (cd bootstrap/host/v2 && sha256sum --check SHA256SUMS)
          gcc -O2 -std=c11 -Wall -Wextra -Werror bootstrap/host/v2/genesis-host.c -o build/genesis-host

      - name: Rebuild Seven-0 fixed point
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'modulo seven0_bootstrap_monolith\n\n'
            for arquivo in $(find compiler0 -maxdepth 1 -type f -name '*.sev' | LC_ALL=C sort); do
              printf '// BEGIN %s\n' "$(basename "$arquivo")"
              sed '/^modulo /d; /^usa /d' "$arquivo"
              printf '// END %s\n\n' "$(basename "$arquivo")"
            done
          } > build/seven0.monolith.sev
          build/genesis-host build/seven0.seed.svbc build/seven0.monolith.sev build/seven0.svbc
          build/genesis-host build/seven0.svbc build/seven0.monolith.sev build/seven0.self.svbc
          cmp build/seven0.svbc build/seven0.self.svbc

      - name: Build Stage1 compiler
        shell: bash
        run: |
          set -euo pipefail
          cat > build/stage1.sources <<'EOF'
          std/base/lista.sev
          std/base/resultado.sev
          std/base/talvez.sev
          std/base/mapa.sev
          std/base/texto.sev
          std/mem/bytes.sev
          std/fs/file.sev
          compiler/ast.sev
          compiler/bytecode.sev
          compiler/diagnostic.sev
          compiler/driver.sev
          compiler/effects.sev
          compiler/emitter.sev
          compiler/ffi.sev
          compiler/ir.sev
          compiler/lexer.sev
          compiler/memory.sev
          compiler/package.sev
          compiler/parser_part00.sev
          compiler/parser_part01.sev
          compiler/parser_part02.sev
          compiler/parser_part03.sev
          compiler/parser_part04.sev
          compiler/parser_part05.sev
          compiler/parser_cursor.sev
          compiler/semantic.sev
          compiler/source.sev
          compiler/symbols.sev
          compiler/token.sev
          compiler/types_part00.sev
          compiler/types_part01.sev
          compiler/types_part02.sev
          compiler/types_part03.sev
          EOF

          {
            printf 'modulo seven_stage1_monolith\n\n'
            while IFS= read -r arquivo; do
              printf '// BEGIN %s\n' "$arquivo"
              case "$arquivo" in
                compiler/bytecode.sev)
                  sed '/^modulo /d; /^usa /d; s/emite_constante(/bytecode_emite_constante(/g' "$arquivo"
                  ;;
                compiler/emitter.sev)
                  sed '/^modulo /d; /^usa /d; s/^campo emite(/campo emite_formato(/' "$arquivo"
                  ;;
                *)
                  sed '/^modulo /d; /^usa /d' "$arquivo"
                  ;;
              esac
              printf '// END %s\n\n' "$arquivo"
            done < build/stage1.sources

            cat <<'EOF'
          campo inicio(argumentos: Lista<Texto>) -> Num toca terminal, disco, ambiente ::
            guarda pedido := pedido_de_compilacao(argumentos)
            guarda saida := compila(pedido)
            veja saida e Sucesso ::
              devolve 0
            outro ::
              mostra_diagnosticos(saida.diagnosticos)
              devolve 1
            fecha
          fecha
          EOF
          } > build/seven.stage1.monolith.sev

          build/genesis-host build/seven0.svbc build/seven.stage1.monolith.sev build/seven.stage1.svbc
          test "$(od -An -tx1 -N4 build/seven.stage1.svbc | tr -d ' \n')" = '53564230'

      - name: Compile native AOT baseline with Stage1
        shell: bash
        run: |
          set -euo pipefail
          cp runtime/platform/native/runtime.sources build/native-aot.sources
          echo 'tests/native/aot_backend.sev' >> build/native-aot.sources
          cat > build/native-aot.pkg <<'EOF'
          pacote native-aot-proof
          versao 0.0.1
          criador Gabriel Barcelos
          entrada tests.native.aot_backend.inicio
          alvo svbc
          indice build/native-aot.sources
          EOF
          build/genesis-host build/seven.stage1.svbc build/native-aot.pkg build/native-aot-test.svbc
          test -s build/native-aot-test.svbc
          test "$(od -An -tx1 -N4 build/native-aot-test.svbc | tr -d ' \n')" = '53564243'

      - name: Execute Seven native generator
        shell: bash
        run: |
          set -euo pipefail
          build/genesis-host build/native-aot-test.svbc
          test "$(od -An -tx1 -N4 build/native-aot-proof | tr -d ' \n')" = '7f454c46'
          test "$(od -An -tx1 -N2 build/native-aot-proof.exe | tr -d ' \n')" = '4d5a'

      - name: Compile native text runtime proof with Stage1
        shell: bash
        run: |
          set -euo pipefail
          cp runtime/platform/native/runtime.sources build/native-text.sources
          echo 'tests/native/text_backend.sev' >> build/native-text.sources
          cat > build/native-text.pkg <<'EOF'
          pacote native-text-proof
          versao 0.0.1
          criador Gabriel Barcelos
          entrada tests.native.text_backend.inicio
          alvo svbc
          indice build/native-text.sources
          EOF
          build/genesis-host build/seven.stage1.svbc build/native-text.pkg build/native-text-test.svbc
          build/genesis-host build/native-text-test.svbc
          test "$(od -An -tx1 -N4 build/native-text-proof | tr -d ' \n')" = '7f454c46'
          test "$(od -An -tx1 -N2 build/native-text-proof.exe | tr -d ' \n')" = '4d5a'

      - name: Execute Seven native text ELF
        shell: bash
        run: |
          set -euo pipefail
          chmod +x build/native-text-proof
          set +e
          ./build/native-text-proof
          code=$?
          set -e
          echo "native text proof exit code: $code"
          test "$code" -eq 42

      - name: Compile native reachability proof with Stage1
        shell: bash
        run: |
          set -euo pipefail
          cp runtime/platform/native/runtime.sources build/native-reachability.sources
          echo 'tests/native/reachability_backend.sev' >> build/native-reachability.sources
          cat > build/native-reachability.pkg <<'EOF'
          pacote native-reachability-proof
          versao 0.0.1
          criador Gabriel Barcelos
          entrada tests.native.reachability_backend.inicio
          alvo svbc
          indice build/native-reachability.sources
          EOF
          build/genesis-host build/seven.stage1.svbc build/native-reachability.pkg build/native-reachability-test.svbc
          build/genesis-host build/native-reachability-test.svbc
          test "$(od -An -tx1 -N4 build/native-reachability-proof | tr -d ' \n')" = '7f454c46'
          test "$(od -An -tx1 -N2 build/native-reachability-proof.exe | tr -d ' \n')" = '4d5a'

      - name: Compile PE multi-DLL import proof with Stage1
        shell: bash
        run: |
          set -euo pipefail
          cp runtime/platform/native/runtime.sources build/native-pe-imports.sources
          echo 'tests/native/pe_imports_backend.sev' >> build/native-pe-imports.sources
          cat > build/native-pe-imports.pkg <<'EOF'
          pacote native-pe-imports-proof
          versao 0.0.1
          criador Gabriel Barcelos
          entrada tests.native.pe_imports_backend.inicio
          alvo svbc
          indice build/native-pe-imports.sources
          EOF
          build/genesis-host build/seven.stage1.svbc build/native-pe-imports.pkg build/native-pe-imports-test.svbc
          build/genesis-host build/native-pe-imports-test.svbc
          test "$(od -An -tx1 -N2 build/native-pe-imports-proof.exe | tr -d ' \n')" = '4d5a'
          objdump -p build/native-pe-imports-proof.exe | tee build/native-pe-imports-proof.pe.txt
          grep -q 'KERNEL32.dll' build/native-pe-imports-proof.pe.txt
          grep -q 'WS2_32.dll' build/native-pe-imports-proof.pe.txt
          grep -q 'socket' build/native-pe-imports-proof.pe.txt

      - name: Inspect generated native formats
        shell: bash
        run: |
          set -euo pipefail
          readelf -h build/native-aot-proof | tee build/native-aot-proof.elf.txt
          objdump -p build/native-aot-proof.exe | tee build/native-aot-proof.pe.txt
          grep -q 'pei-x86-64' build/native-aot-proof.pe.txt
          grep -q 'KERNEL32.dll' build/native-aot-proof.pe.txt
          grep -q 'ExitProcess' build/native-aot-proof.pe.txt
          grep -q 'VirtualAlloc' build/native-aot-proof.pe.txt

      - name: Execute Seven-generated ELF
        shell: bash
        run: |
          set -euo pipefail
          chmod +x build/native-aot-proof
          set +e
          ./build/native-aot-proof
          code=$?
          set -e
          if test "$code" -ne 42; then
            echo "native exit code: $code"
            dd if=build/native-aot-proof of=build/native-aot-code.bin bs=1 skip=4096 status=none || true
            objdump -D -b binary -m i386:x86-64 --adjust-vma=0x401000 -Mintel build/native-aot-code.bin | tail -n 320 || true
            if command -v strace >/dev/null 2>&1; then
              set +e
              strace -f -o build/native-aot-proof.strace ./build/native-aot-proof
              set -e
              tail -n 80 build/native-aot-proof.strace || true
            fi
          fi
          test "$code" -eq 42

      - name: Reject transition native lowering
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R -n 'sys_native_baixa' runtime compiler std

      - uses: actions/upload-artifact@v4
        with:
          name: seven-native-aot-proof
          path: |
            build/native-aot-proof
            build/native-aot-proof.exe
            build/native-aot-test.svbc
            build/native-text-proof
            build/native-text-proof.exe
            build/native-text-test.svbc
            build/native-aot-proof.elf.txt
            build/native-aot-proof.pe.txt
            build/native-pe-imports-proof.exe
            build/native-pe-imports-test.svbc
            build/native-pe-imports-proof.pe.txt
            build/native-reachability-proof
            build/native-reachability-proof.exe
            build/native-reachability-test.svbc
          if-no-files-found: error

  windows:
    name: Execute Stage1-generated PE32+
    needs: generate
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: seven-native-aot-proof
          path: build

      - name: Execute Seven-generated PE
        shell: bash
        run: |
          set +e
          ./build/native-aot-proof.exe
          code=$?
          set -e
          test "$code" -eq 42

      - name: Execute Seven native text PE
        shell: bash
        run: |
          set +e
          ./build/native-text-proof.exe
          code=$?
          set -e
          test "$code" -eq 42
