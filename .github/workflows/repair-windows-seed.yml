name: Repair Seven 0.2 Windows Seed

on:
  push:
    branches:
      - agent/seven-web-build
    paths:
      - .github/workflows/repair-windows-seed.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seven-windows-seed-repair
  cancel-in-progress: false

jobs:
  repair:
    name: Rebuild transition seeds with Windows argv support
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/seven-web-build
          fetch-depth: 0

      - name: Materialize audited rebuild procedure
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/scripts
          git show d786cf8b432e72283163a5dc43bfc8d5f4d7105b:.github/scripts/rebuild-web-seeds.sh > .github/scripts/rebuild-web-seeds.sh
          git show d786cf8b432e72283163a5dc43bfc8d5f4d7105b:.github/scripts/run-rebuild-web-seeds.sh > .github/scripts/run-rebuild-web-seeds.sh
          chmod +x .github/scripts/rebuild-web-seeds.sh .github/scripts/run-rebuild-web-seeds.sh

      - name: Patch transition parser and rebuild seeds
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT=.github/scripts/rebuild-web-seeds.sh python - <<'PY'
          import base64
          import os
          from pathlib import Path

          path = Path(os.environ['SCRIPT'])
          text = path.read_text()
          anchor = "PYWEB\n'''\n\nif build_marker"
          if anchor not in text:
              raise SystemExit('nested bootstrap patch anchor not found')

          pattern = 'c3RhdGljIGludCBwYXJzZV9jbWRsaW5lXChjaGFyXCpzLGNoYXJcKlwqYXJndixpbnQgbWF4XClcey4qP3JldHVybiBhcmdjO1x9'
          replacement = ''
          repair = """PYWEB
          CHECKER_SOURCE=\"$work/seven-bootstrap.c\" python - <<'PYPARSE'
          import base64
          import os
          import re
          from pathlib import Path

          path = Path(os.environ['CHECKER_SOURCE'])
          source = path.read_text()
          pattern = base64.b64decode('""" + pattern + """').decode()
          replacement = base64.b64decode('""" + replacement + """').decode()
          source, count = re.subn(pattern, replacement, source, count=1, flags=re.S)
          if count != 1:
              raise SystemExit('Windows parse_cmdline target not found')
          path.write_text(source)
          PYPARSE
          '''

          if build_marker"""
          path.write_text(text.replace(anchor, repair, 1))
          PY
          bash .github/scripts/run-rebuild-web-seeds.sh

      - name: Commit hashes and remove repair machinery
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/rebuild-web-seeds.sh \
            .github/scripts/run-rebuild-web-seeds.sh \
            .github/scripts/rebuild-semantic-seeds.sh \
            .github/scripts/enable-generic-fields.py
          git rm .github/workflows/repair-windows-seed.yml
          git add .github/workflows/foundation.yml .github/workflows/readiness.yml .github/workflows/web.yml
          git config user.name gabriell211
          git config user.email 102088315+gabriell211@users.noreply.github.com
          git commit -m 'fix Windows transition seed argument parsing'
          git push origin HEAD:agent/seven-web-build
