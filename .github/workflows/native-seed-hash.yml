name: Native Seed Hash Diagnostic

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct and inspect archive
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/native-seeds
          : > build/native-seeds.zip
          for part in seed/native/archive/native-seeds.zip.part[0-9][0-9].b64; do
            echo "PART $part"
            wc -c "$part"
            tr -cd 'A-Za-z0-9+/=' < "$part" | base64 --decode >> build/native-seeds.zip
          done
          echo 'RECONSTRUCTED ARCHIVE'
          wc -c build/native-seeds.zip
          sha256sum build/native-seeds.zip
          unzip -t build/native-seeds.zip
          unzip -q build/native-seeds.zip -d build/native-seeds
          sha256sum build/native-seeds/*
