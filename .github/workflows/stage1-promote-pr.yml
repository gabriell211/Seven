name: Promote Stage 1 from PR

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stage1-promote-pr
  cancel-in-progress: false

jobs:
  promote:
    if: github.head_ref == 'stage1-self-host-final' || github.ref_name == 'stage1-self-host-final'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: stage1-self-host-final
          fetch-depth: 0
      - name: Verify and promote canonical sources
        shell: bash
        run: bash bootstrap/promote-stage1.sh
