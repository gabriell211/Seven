name: Seven Production Readiness

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seven-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readiness:
    name: Compiler, conformance and source contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v6

      - name: Verify canonical grammar synchronization
        shell: bash
        run: |
          set -euo pipefail
          cmp syntax/seven.tmLanguage.json editors/vscode/seven-language/syntaxes/seven.tmLanguage.json
          grep -q '"fileTypes": \["sev"\]' syntax/seven.tmLanguage.json
          grep -q '"scopeName": "source.seven"' syntax/seven.tmLanguage.json

      - name: Verify deterministic source index
        shell: bash
        run: |
          set -euo pipefail
          find compiler compiler0 runtime std bootstrap \
            -type f -name '*.sev' -print | LC_ALL=C sort > "$RUNNER_TEMP/seven.sources"
          diff -u seven.sources "$RUNNER_TEMP/seven.sources"
          grep -q '^indice seven.sources$' seven.pkg
          grep -q 'fonte_carrega_indice' compiler/source.sev

      - name: Rebuild current source-backed compiler
        shell: bash
        run: |
          set -euo pipefail
          bash tests/compiler/build_transition_compiler.sh

          root="$PWD/build/readiness-root"
          mkdir -p "$root/bin"
          cp build/seven.transition.svbc "$root/seven.svbc"
          cp -R std "$root/std"
          gcc -DSEVEN_RELEASE_HOST -O2 -std=c11 -Wall -Wextra -Werror \
            bootstrap/host/v2/genesis-host.c -o "$root/bin/seven"
          chmod +x "$root/bin/seven"

          "$root/bin/seven" --version
          sha256sum "$root/bin/seven" "$root/seven.svbc"

      - name: Exercise compiler, WebAssembly and conformance behavior
        shell: bash
        run: |
          set -uo pipefail
          seven="$PWD/build/readiness-root/bin/seven"
          failures=0

          "$seven" --version || failures=$((failures + 1))
          "$seven" check examples/hello.sev || failures=$((failures + 1))
          "$seven" build examples/hello.sev build/readiness-hello.svbc || failures=$((failures + 1))
          "$seven" web build examples/web_app.sev build/readiness-web || failures=$((failures + 1))
          "$seven" run examples/hello.sev > build/readiness-run.txt || failures=$((failures + 1))
          "$seven" doctor > build/readiness-doctor.txt || failures=$((failures + 1))

          while IFS= read -r file; do
            echo "valid: $file"
            "$seven" check "$file" || failures=$((failures + 1))
          done < <(find conformance -type f -path '*/valid/*.sev' | sort)

          while IFS= read -r file; do
            echo "invalid: $file"
            if "$seven" check "$file"; then
              echo "ERROR: invalid conformance file was accepted: $file"
              failures=$((failures + 1))
            fi
          done < <(find conformance -type f -path '*/invalid/*.sev' | sort)

          test -s build/readiness-hello.svbc || failures=$((failures + 1))
          test -s build/readiness-web/app.wasm || failures=$((failures + 1))
          test -s build/readiness-web/seven.web.json || failures=$((failures + 1))
          test "$(od -An -tx1 -N4 build/readiness-web/app.wasm | tr -d ' \n')" = '0061736d' || failures=$((failures + 1))
          grep -q 'Seven nasceu.' build/readiness-run.txt || failures=$((failures + 1))
          grep -q 'compiler: source-backed' build/readiness-doctor.txt || failures=$((failures + 1))
          grep -q '"target": "webassembly"' build/readiness-web/seven.web.json || failures=$((failures + 1))

          node -e 'const fs=require("fs"); if(!WebAssembly.validate(fs.readFileSync("build/readiness-web/app.wasm"))) process.exit(1)' || failures=$((failures + 1))

          echo "readiness failures: $failures"
          test "$failures" -eq 0

      - name: Verify transition compiler source closure
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            test -f "$file"
            grep -Fxq "$file" seven.sources
          done < compiler/toolchain/transition.sources

          cmp build/seven.transition.svbc build/seven.transition.self.svbc
          grep -q 'campo transicao_web_build' compiler/toolchain/transition_cli.sev
          grep -q 'prepara_ir_web' compiler/toolchain/transition_cli.sev
          grep -q 'SEVEN_RELEASE_HOST' bootstrap/host/v2/genesis-host.c

      - name: Reject production placeholders
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E 'comando ainda nao implementado|intrinseco puro ainda nao ligado' compiler runtime std; then
            echo 'Production placeholders remain in the public compiler/runtime surface.'
            exit 1
          fi

      - name: Verify compiler contracts and regressions
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'aplica_linha_manifesto' compiler/package.sev
          grep -q 'pedido_caso_teste' compiler/toolchain/test_runner.sev
          ! grep -q 'pedido_de_compilacao(lista<Texto>())' compiler/toolchain/test_runner.sev
          grep -q 'LimiteBlocoMemoria' runtime/svbc/memory.sev
          grep -q 'rejeita bloco maior que 64 MiB' tests/runtime/svbc_memory.sev
          grep -q 'uninstall' compiler/toolchain/installer.sev
          grep -q '\.sev' compiler/toolchain/installer.sev
          grep -q 'Seven 0.2.0' compiler/toolchain/cli.sev
          grep -q '^versao 0.2.0$' seven.pkg
          ! grep -q 'build/native-seeds/seven-linux' .github/workflows/readiness.yml
