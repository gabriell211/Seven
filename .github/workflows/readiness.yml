name: Seven Production Readiness

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seven-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize-stage1:
    name: Publish canonical Stage 1 sources
    if: github.event_name == 'pull_request' && github.head_ref == 'stage1-self-host-clean'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: stage1-self-host-clean

      - name: Publish one clean canonical commit
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/final-stage1.tar.gz"
          base64 --decode bootstrap/final-stage1.tar.gz.b64 > "$archive"
          echo '22f44e9dfeed0f676ae3583e47ce550ef0f79bfd712f17c9f3eaec025d6b3548  '"$archive" | sha256sum --check

          git reset --hard 0575069a270a7b5864919b4d0b8699e0321ea840
          tar -xzf "$archive"

          (cd bootstrap/host/v2 && sha256sum --check SHA256SUMS)
          ! grep -R -n -E 'stage1 argumentos|parser pos|parser token|ChatGPT|chatgpt|OpenAI|assistente' \
            compiler compiler0 std bootstrap/host/v2

          git add \
            bootstrap/host/v2 \
            compiler0/parse.sev \
            compiler/ast.sev \
            compiler/effects.sev \
            compiler/ir.sev \
            compiler/lexer.sev \
            compiler/memory.sev \
            compiler/parser.sev \
            compiler/parser_cursor.sev \
            compiler/source.sev \
            compiler/token.sev \
            compiler/types.sev \
            std/base/lista.sev \
            std/base/mapa.sev \
            std/base/texto.sev

          git diff --cached --check
          git config user.name 'Gabriel Barcelos'
          git config user.email '102088315+gabriell211@users.noreply.github.com'
          git commit -m 'Complete Seven Stage 1 self-hosting'
          git push --force origin HEAD:stage1-self-host-clean

  readiness:
    name: Compiler, conformance and source contracts
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Verify canonical grammar synchronization
        shell: bash
        run: |
          set -euo pipefail
          cmp syntax/seven.tmLanguage.json editors/vscode/seven-language/syntaxes/seven.tmLanguage.json
          grep -q '"fileTypes": \["sev"\]' syntax/seven.tmLanguage.json
          grep -q '"scopeName": "source.seven"' syntax/seven.tmLanguage.json

      - name: Verify deterministic source index
        shell: bash
        run: |
          set -euo pipefail
          find compiler compiler0 runtime std bootstrap \
            -type f -name '*.sev' -print | LC_ALL=C sort > "$RUNNER_TEMP/seven.sources"
          cmp seven.sources "$RUNNER_TEMP/seven.sources"
          grep -q '^indice seven.sources$' seven.pkg
          grep -q 'fonte_carrega_indice' compiler/source.sev

      - name: Reconstruct audited Seven 0.2 transition seeds
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/native-seeds
          cat seed/native/final/v1/part*.b64 | tr -d '\r\n\t ' | base64 --decode > build/native-seeds.zip
          echo '670646ab39df2f2a111c664e16023af3ddc3b203982945609193da99d8c4bac7  build/native-seeds.zip' | sha256sum --check
          unzip -t build/native-seeds.zip
          unzip -q build/native-seeds.zip -d build/native-seeds
          echo '156bb5f78286431db7813d932bdf2835029ee706e1de61829ca42be81abf5802  build/native-seeds/seven-linux' | sha256sum --check
          echo '80f1948e83b1c58c719c2ae0579a4b03edd1ccc1bf1e4e52091e2c66478feba5  build/native-seeds/seven-windows.exe' | sha256sum --check
          chmod +x build/native-seeds/seven-linux

      - name: Exercise compiler, WebAssembly and conformance behavior
        shell: bash
        run: |
          set -uo pipefail
          seven="$PWD/build/native-seeds/seven-linux"
          failures=0

          "$seven" --version || failures=$((failures + 1))
          "$seven" check examples/hello.sev || failures=$((failures + 1))
          "$seven" build examples/hello.sev build/readiness-hello.svbc || failures=$((failures + 1))
          "$seven" web build examples/hello.sev build/readiness-web || failures=$((failures + 1))
          "$seven" run examples/hello.sev || failures=$((failures + 1))
          "$seven" doctor || failures=$((failures + 1))

          while IFS= read -r file; do
            echo "valid: $file"
            "$seven" check "$file" || failures=$((failures + 1))
          done < <(find conformance -type f -path '*/valid/*.sev' | sort)

          while IFS= read -r file; do
            echo "invalid: $file"
            if "$seven" check "$file"; then
              echo "ERROR: invalid conformance file was accepted: $file"
              failures=$((failures + 1))
            fi
          done < <(find conformance -type f -path '*/invalid/*.sev' | sort)

          test -s build/readiness-hello.svbc || failures=$((failures + 1))
          test -s build/readiness-web/app.wasm || failures=$((failures + 1))
          test -s build/readiness-web/seven.web.json || failures=$((failures + 1))
          grep -q '"target": "webassembly"' build/readiness-web/seven.web.json || failures=$((failures + 1))

          echo "readiness failures: $failures"
          test "$failures" -eq 0

      - name: Check every indexed Seven source
        shell: bash
        run: |
          set -euo pipefail
          seven="$PWD/build/native-seeds/seven-linux"
          while IFS= read -r file; do
            echo "source: $file"
            "$seven" check "$file"
          done < seven.sources

      - name: Reject production placeholders
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n -E 'comando ainda nao implementado|intrinseco puro ainda nao ligado' compiler runtime std; then
            echo 'Production placeholders remain in the public compiler/runtime surface.'
            exit 1
          fi

      - name: Verify compiler contracts and regressions
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'aplica_linha_manifesto' compiler/package.sev
          grep -q 'pedido_caso_teste' compiler/toolchain/test_runner.sev
          ! grep -q 'pedido_de_compilacao(lista<Texto>())' compiler/toolchain/test_runner.sev
          grep -q 'LimiteBlocoMemoria' runtime/svbc/memory.sev
          grep -q 'rejeita bloco maior que 64 MiB' tests/runtime/svbc_memory.sev
          grep -q 'uninstall' compiler/toolchain/installer.sev
          grep -q '\.sev' compiler/toolchain/installer.sev
          grep -q 'Seven 0.2.0' compiler/toolchain/cli.sev
          grep -q '^versao 0.2.0$' seven.pkg
