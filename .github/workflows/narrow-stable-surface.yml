name: Align Stable Seven 0.1 Surface

on:
  push:
    branches:
      - gabriell211/production-readiness
    paths:
      - .github/workflows/narrow-stable-surface.yml

permissions:
  contents: write

jobs:
  align:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gabriell211/production-readiness
          fetch-depth: 0
      - run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          changes = {
              Path('compiler/toolchain/cli.sev'): [
                  ('seven estavel <check|build|run|test|doctor|install|uninstall|installer|verify>', 'seven estavel <check|build|run|doctor>'),
                  ('seven preview <bench|fmt|lint|doc|repl|debug|profile|lsp|pkg|target|web|serve|release>', 'seven preview <test|bench|fmt|lint|doc|repl|debug|profile|install|uninstall|installer|lsp|pkg|target|web|serve|release|verify>'),
              ],
              Path('runtime/platform/svbc/toolchain.sev'): [
                  ('seven estavel <check|build|run|test|doctor|install|uninstall|installer|verify>', 'seven estavel <check|build|run|doctor>'),
              ],
              Path('README.md'): [
                  ('seven test\nseven fmt\nseven lsp\nseven pkg verify\nseven verify foundation\nseven verify bootstrap\nseven verify production\nseven release', 'seven doctor\n\n# Superficie de preview no codigo-fonte\nseven test\nseven fmt\nseven lsp\nseven pkg verify\nseven verify foundation\nseven verify bootstrap\nseven verify production\nseven release'),
              ],
          }
          for path, replacements in changes.items():
              text = path.read_text()
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f'expected text not found in {path}: {old}')
                  text = text.replace(old, new)
              path.write_text(text)
          PY
          git config user.name gabriell211
          git config user.email 102088315+gabriell211@users.noreply.github.com
          git add compiler/toolchain/cli.sev runtime/platform/svbc/toolchain.sev README.md
          git commit -m 'align stable commands with executable Seven 0.1'
          git push origin HEAD:gabriell211/production-readiness
