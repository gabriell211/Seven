name: Synchronize Windows Seed Hashes

on:
  pull_request:
    paths:
      - .github/scripts/rebuild-windows-mingw.sh
      - .github/workflows/rebuild-windows-mingw.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seven-windows-seed-sync
  cancel-in-progress: true

jobs:
  synchronize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gabriell211/production-readiness
          fetch-depth: 0

      - name: Verify seed and synchronize workflow hashes
        shell: bash
        run: bash .github/scripts/rebuild-windows-mingw.sh
