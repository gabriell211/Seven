name: Rebuild Seven Web Seeds

on:
  pull_request:
    paths:
      - .github/scripts/rebuild-web-seeds.sh
      - .github/workflows/rebuild-web-seeds.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seven-web-seed-rebuild
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/seven-web-build
          fetch-depth: 0

      - name: Install Windows cross compiler
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Rebuild and validate web-enabled seeds
        shell: bash
        run: bash .github/scripts/rebuild-web-seeds.sh
