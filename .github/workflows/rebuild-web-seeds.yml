name: Rebuild Seven 0.2 Transition Seeds

on:
  pull_request:
    paths:
      - .github/scripts/rebuild-web-seeds.sh
      - .github/workflows/rebuild-web-seeds.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seven-web-seed-rebuild
  cancel-in-progress: true

jobs:
  rebuild:
    name: Rebuild Windows and Linux transition seeds
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/seven-web-build
          fetch-depth: 0

      - name: Rebuild and validate Seven 0.2 seeds
        shell: bash
        run: bash .github/scripts/rebuild-web-seeds.sh
