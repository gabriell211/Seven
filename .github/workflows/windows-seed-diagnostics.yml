name: Diagnose Windows Seed

on:
  pull_request:
    paths:
      - .github/workflows/windows-seed-diagnostics.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct audited seed
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/native-seeds
          cat seed/native/final/v1/part*.b64 | tr -d '\r\n\t ' | base64 --decode > build/native-seeds.zip
          echo '59ee731203136a87c72ea58ea02a55221f09f7dcdae4c1b143758cdd2df605b1  build/native-seeds.zip' | sha256sum --check
          unzip -q build/native-seeds.zip -d build/native-seeds
          echo '0f1f1c994eb2dcf8a8412b8cf33751371f0832937f2556ba3c7405f49fa984aa  build/native-seeds/seven-windows.exe' | sha256sum --check

      - name: Exercise path and command handling
        shell: cmd
        run: |
          @echo on
          setlocal EnableExtensions EnableDelayedExpansion
          set "SEVEN=%CD%\build\native-seeds\seven-windows.exe"
          dir "%CD%\examples\hello.sev"
          "%SEVEN%" --version
          echo version-exit=!ERRORLEVEL!

          "%SEVEN%" check "examples\hello.sev" > relative.out 2>&1
          set "REL=!ERRORLEVEL!"
          type relative.out
          echo relative-exit=!REL!

          "%SEVEN%" check "%CD%\examples\hello.sev" > absolute.out 2>&1
          set "ABS=!ERRORLEVEL!"
          type absolute.out
          echo absolute-exit=!ABS!

          copy /y examples\hello.sev build\native-seeds\hello.sev
          pushd build\native-seeds
          seven-windows.exe check hello.sev > adjacent.out 2>&1
          set "ADJ=!ERRORLEVEL!"
          type adjacent.out
          echo adjacent-exit=!ADJ!
          popd

          echo summary relative=!REL! absolute=!ABS! adjacent=!ADJ!
          if not "!REL!"=="0" exit /b !REL!
          if not "!ABS!"=="0" exit /b !ABS!
          if not "!ADJ!"=="0" exit /b !ADJ!
          exit /b 0
